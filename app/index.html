<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B2FF5">
<title>Evarel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Evarel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="ev-app" id="app"></div>
<nav class="ev-nav" aria-label="เมนูหลัก"><ul id="nav"></ul></nav>
<button class="ev-fab" id="fab" aria-label="เพิ่ม"></button>
<div class="ev-toast" id="toast" role="status" aria-live="polite" data-open="false"></div>
<div class="ev-scrim" id="scrim"></div>
<aside class="ev-sheet" id="sheet" role="dialog" aria-modal="true"></aside>
<section class="ev-focus" id="focus" role="dialog" aria-modal="true" aria-label="จับเวลา" data-open="false" hidden></section>
<section class="ev-ai" id="aiPage" role="dialog" aria-modal="true" aria-label="ผู้ช่วย AI" data-open="false" hidden></section>
<div class="ev-menu" id="menu" role="menu" data-open="false" hidden></div>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register fail', err));
}
</script>
</body>
</html>
