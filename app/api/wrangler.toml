# Evarel API (Cloudflare Worker)
# สองสภาพแวดล้อมจากโค้ดชุดเดียว:
#   forge      = ชุดพัฒนา (สาขา develop) ไม่ใช่สาธารณะ  -> evarel-api-forge
#   production = ชุดทางการ (สาขา main)                    -> evarel-api
# account_id ไม่ฝังในไฟล์ ให้ตั้งตัวแปรสภาพแวดล้อม CLOUDFLARE_ACCOUNT_ID
# secret ไม่อยู่ในไฟล์ ดู app/api/README.md หัวข้อ Secrets

main = "src/index.ts"
compatibility_date = "2026-05-03"

[env.forge]
name = "evarel-api-forge"
# ตัวจัดเวลาแจ้งเตือนทุกนาที เปิดเฉพาะ forge ก่อน (บัญชีฟรีมี Cron 5 ตัวทั้งบัญชี) ชุดทางการเปิดหลังพิสูจน์ที่ forge
[env.forge.triggers]
crons = ["* * * * *"]
# เปิดเก็บล็อกเพื่อดูว่า cron ยิงจริง (Workers Logs ฟรีบนแผนฟรี 200,000 เหตุการณ์/วัน เก็บ 3 วัน; ตัวจัดเวลาเขียน ~2,900/วัน)
# หมายเหตุ: เริ่ม 1 ธ.ค. 2026 Cloudflare เปลี่ยนราคา Observability ต้องตรวจก่อนวันนั้นว่ายังฟรีหรือไม่
[env.forge.observability]
enabled = true
head_sampling_rate = 1
[env.forge.vars]
ALLOWED_ORIGIN = "https://evarel-app-forge.nontakorn2600.workers.dev,http://localhost:8779"
REQUIRE_EMAIL_VERIFICATION = "true"

[env.production]
name = "evarel-api"
[env.production.vars]
ALLOWED_ORIGIN = "https://evarel-app.nontakorn2600.workers.dev"
REQUIRE_EMAIL_VERIFICATION = "true"
