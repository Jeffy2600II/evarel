# Path: .github/workflows/web.yml | Purpose: ระบบอัปเดตเว็บ Evarel — ตรวจโน้ตรุ่น, ทดสอบ, build, deploy forge, ตรวจหลัง deploy
# ขอบเขต: develop -> forge เท่านั้น | production ไม่มี job ใดแตะ (กฎ Master: ห้ามแตะ production โดยพลการ ต้องสั่งเอง)
# ฐานสำหรับแอปมือถือ (ภายหลัง): job ปล่อยรุ่นจะอ่าน releases/current.json และสร้าง GitHub Release ตัวเดียวกัน
name: web

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/next/package-lock.json
      - name: ตรวจโน้ตรุ่น (ทุกอัปเดตที่ส่งถึงผู้ใช้ต้องมีโน้ตใหม่)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          node scripts/check-release-notes.mjs "$BASE"
      - name: ติดตั้งแพ็กเกจ (ราก = tailwind/esbuild/wrangler | web/next = next/react ของตัวเอง ไม่ต้อง symlink)
        run: |
          npm ci
          npm ci --prefix web/next
      - name: ตรวจไฟล์คอมไพล์ตรงกับซอร์ส (กัน commit src แต่ลืมไฟล์ที่คอมไพล์แล้ว)
        run: |
          node scripts/build-react.mjs --check
          node scripts/gen-m-globals.mjs --check
          node scripts/compile-ts.mjs > /dev/null
          if ! git diff --quiet -- web/runtime/js; then
            echo "ไฟล์ใน web/runtime/js ไม่ตรงกับ web/src: รัน npm run build:ts และ npm run build:react แล้ว commit ไฟล์ที่เปลี่ยน"
            git diff --stat -- web/runtime/js
            exit 1
          fi
      - name: ห้ามมีระบบเดา/ชี้ทางอีเมล (กันข้อบกพร่องด้านความเป็นส่วนตัวกลับมา)
        run: node tests/no-email-guessing.test.mjs
      - name: เทสต์เทียบชุด Node ล้วน 6 ชุด (อ่านตัวอ้างอิงจาก git commit ฐานเก่า จึงต้องมี fetch-depth 0 ด้านบน)
        run: |
          node tests/aiproposal_equiv.test.mjs
          node tests/calendar_equiv.test.mjs
          node tests/core_equiv.test.mjs
          node tests/settingsviews_equiv.test.mjs
          node tests/stats_html_equiv.test.mjs
          node tests/today_equiv.test.mjs
      # ชุดเทียบที่เหลือ (เปิดเบราว์เซอร์ ~42 ไฟล์) ไม่เอาเข้า CI: ต้องมี SUPABASE_SERVICE_KEY (.agents/.env) + chromium 1243 ที่ pin + ยิง forge จริง
      # จึงเป็นเครื่องมือรันมือตาม tests/README.md ชุด Node ล้วนข้างบนคือส่วนที่ CI เฝ้าได้แทน (บทเรียน F7: ของที่ไม่มีใครรันจะพังเงียบ ๆ)
      - name: build forge (พิสูจน์ว่า build ผ่าน)
        run: node scripts/build-web.mjs forge
      - name: ตรวจความสมบูรณ์ของผลบิลด์ (ไฟล์ที่อ้างมีจริง สคริปต์ parse ได้ ไม่มี js/m กล่องครบ แคช sw ไม่อ้างไฟล์ผี) | สถิต ไม่เปิดเบราว์เซอร์ ไม่ใช้ความลับ
        run: node tests/build_integrity.test.mjs
      - name: ตรวจ release.json ตรงกับ service worker
        run: |
          node -e "
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('build/web/release.json','utf8'));
          const sw=fs.readFileSync('build/web/sw.js','utf8');
          const m=sw.match(/const VERSION = 'evarel-next-([0-9a-f]+)'/);
          if(!m||m[1]!==r.build){console.error('release.build != sw VERSION',r.build,m&&m[1]);process.exit(1)}
          if(/release\.json/.test(sw.match(/const CORE = \[[\s\S]*?\];/)[0])){console.error('release.json ห้ามอยู่ในแคช CORE');process.exit(1)}
          const av=sw.match(/const APP_VERSION = '([^']*)'/);
          if(!av||av[1]!==r.version){console.error('release.version != sw APP_VERSION',r.version,av&&av[1]);process.exit(1)}
          if(!/^\d{4}\.[1-9]\d*\.(0|[1-9]\d*)-forge\$/.test(r.version)){console.error('เลขรุ่นบน forge ต้องเป็น ปี.รอบ.แพตช์-forge ได้',r.version);process.exit(1)}
          const as=sw.match(/const ASSET_V = '([0-9a-f]+)'/); const html=fs.readFileSync('build/web/index.html','utf8');
          if(!as||as[1]!==r.assets){console.error('release.assets != sw ASSET_V',r.assets,as&&as[1]);process.exit(1)}
          if(!html.includes('styles/app.css?v='+r.assets)){console.error('index.html ไม่ได้ผูก ?v= ตรงกับ release.assets');process.exit(1)}
          const hv=html.match(/__EV_VERSION__ = \"([^\"]+)\"/); if(!hv||hv[1]!==r.version){console.error('index.html __EV_VERSION__ != release.version',hv&&hv[1],r.version);process.exit(1)}
          console.log('RELEASE-JSON OK build',r.build,'assets',r.assets,'v'+r.version);"
      - uses: actions/upload-artifact@v4
        with: { name: web-build, path: build/web, retention-days: 3 }

  # สายพานโรงงาน (F5): ตรวจกติกากล่อง + วาดแผนที่ใหม่ทุก push + X-ray รายหน้า + ตรวจแผน/เกตแคช core (รอบ 2026.2.62)
  # เครื่องมือเป็น Node + python3 ของรันเนอร์ ไม่ต้อง npm ci (รวมวัดจริง < 1 วินาที) | ไม่ commit อะไรกลับเข้ารีโป (กันวน CI) แผนที่ออกเป็น artifact
  # ถอด job นี้ออกแล้วเครื่องตรวจยังรันมือได้: node tools/factory/checker.mjs --all
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # ด่านตรวจตารางไฟล์อ้างอิงต้องอ่านประวัติเพื่อ git show commit ฐาน (โคลนตื้นจะหาของไม่เจอ)
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: ตรวจกติกากล่อง BOX-01..06 (ไม่ผ่าน = ไม่ปล่อย)
        run: |
          set -o pipefail
          node tools/factory/checker.mjs --all | tee factory-check.txt
      - name: วาดแผนที่โรงงานใหม่จากโครงสร้างจริง
        if: always()
        run: |
          mkdir -p factory-out
          node tools/factory/mapper.mjs factory-out/FACTORY-MAP.md
          node tools/factory/mapper.mjs factory-out/FACTORY-MAP.again.md
          cmp factory-out/FACTORY-MAP.md factory-out/FACTORY-MAP.again.md && rm factory-out/FACTORY-MAP.again.md
      - name: แผนที่ที่ commit ไว้ต้องไม่ล้าสมัย
        run: |
          if ! diff -q docs/FACTORY-MAP.md factory-out/FACTORY-MAP.md >/dev/null; then
            echo "docs/FACTORY-MAP.md ล้าสมัย: รัน node tools/factory/mapper.mjs แล้ว commit (ห้ามแก้มือ)"
            diff docs/FACTORY-MAP.md factory-out/FACTORY-MAP.md | head -20
            exit 1
          fi
      - name: X-ray รายหน้า (ทุกกล่องใน web/pages)
        if: always()
        run: |
          for d in web/pages/*/; do n=$(basename "$d"); echo "=== $n ==="; node tools/factory/xray.mjs "$n"; done | tee factory-out/xray.txt
      - name: ความคืบหน้าทำให้ m/ ว่าง (F6) รายงานอย่างเดียว ไม่บล็อก แต่ผลต้องแน่นอนสองรอบ
        run: |
          mkdir -p factory-out
          node tools/factory/m_progress.mjs | tee factory-out/m-progress.txt
          node tools/factory/m_progress.mjs > factory-out/m-progress.again.txt
          cmp factory-out/m-progress.txt factory-out/m-progress.again.txt && rm factory-out/m-progress.again.txt
      - name: ตรวจแผน docs/plan ตามกติกา (ลิงก์ไม่หัก ไม่มีอิโมจิ/em dash ไม่มีความลับ ทุกขั้นมีไฟล์ลึก)
        run: python3 tools/plan_check.py
      - name: เกตแคช core ของ service worker (import ./core/ ทุกตัวต้องอยู่ใน CORE ของ sw.js ไม่งั้นออฟไลน์พังเงียบ)
        run: node tests/m_core_import.test.mjs
      - name: ตารางไฟล์อ้างอิงของเทสต์เทียบยังใช้ได้ (tests/refs.lock.json -> git commit ฐาน)
        run: node scripts/gen-equiv-refs.mjs --check
      - name: โดเมนทั้งระบบเป็น ordivel-* (กันชื่อยุคเก่ากลับมาแล้วยิงไปโดเมนที่ปิดไปแล้ว)
        run: node tests/domains.test.mjs
      - name: สรุปผลขึ้นหน้า run
        if: always()
        run: |
          { echo "### สายพานโรงงาน"; echo '```'; cat factory-check.txt 2>/dev/null; echo '```'; echo "แผนที่และ X-ray อยู่ใน artifact \`factory-out\`"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: factory-out, path: factory-out, retention-days: 14 }

  deploy-forge:
    needs: [check, factory]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { name: web-build, path: build/web }
      - name: deploy forge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          node scripts/deploy.mjs forge
      - name: ตรวจหลัง deploy (release.json บนเว็บจริงต้องตรงกับที่เพิ่ง build)
        run: |
          WANT=$(node -p "require('./build/web/release.json').build")
          for i in 1 2 3 4 5 6; do
            GOT=$(curl -fsS -H 'Cache-Control: no-store' "https://ordivel-app-forge.nontakorn2600.workers.dev/release.json?_=$RANDOM" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).build" 2>/dev/null || echo none)
            echo "ลองครั้งที่ $i: เว็บ=$GOT ต้องการ=$WANT"
            [ "$GOT" = "$WANT" ] && echo "POST-DEPLOY OK" && exit 0
            sleep 10
          done
          echo "POST-DEPLOY FAIL: เว็บยังไม่ได้รุ่นที่เพิ่ง deploy"; exit 1
