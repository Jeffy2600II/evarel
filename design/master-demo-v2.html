<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evarel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Path: /evarel-demo.html (ส่วน tokens → ย้ายเป็น styles/tokens.css ได้ทั้งก้อน)
   Purpose: เดโม UI Evarel มือถือเป็นหลัก | Used by: ใช้เป็นต้นแบบให้ AI/Zenith แปลงเป็นโครงจริง */

/* ============ TOKENS (แก้ที่นี่ที่เดียว = เปลี่ยนทั้งแอป) ============ */
:root{
  --font:'IBM Plex Sans Thai',system-ui,sans-serif;
  --c-bg:#F7F7F9; --c-surface:#fff; --c-text:#14141A; --c-muted:#767683; --c-line:#ECECF0;
  --c-accent:#4B2FF5; --c-accent-soft:#EEEBFF; --c-on-accent:#fff;
  --c-ok:#18A66A; --c-warn:#E8890C; --c-danger:#E5484D;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px;           /* 8px scale */
  --r-card:20px; --r-pill:999px; --r-sheet:28px;
  --shadow:0 1px 2px rgba(20,20,26,.04),0 8px 24px rgba(20,20,26,.06);
  --t-fast:.18s; --nav-h:64px; --col-max:480px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-bg:#0E0E12; --c-surface:#1A1A21; --c-text:#F2F2F5; --c-muted:#9A9AA8; --c-line:#2A2A33;
  --c-accent:#7C69FF; --c-accent-soft:#25214A; --shadow:none}}
:root[data-theme="dark"]{--c-bg:#0E0E12;--c-surface:#1A1A21;--c-text:#F2F2F5;--c-muted:#9A9AA8;--c-line:#2A2A33;--c-accent:#7C69FF;--c-accent-soft:#25214A;--shadow:none}

/* ============ LAYOUT ============ */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);-webkit-tap-highlight-color:transparent}
.ev-app{max-width:var(--col-max);margin:0 auto;min-height:100%;padding:env(safe-area-inset-top,0) 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0) + var(--s4))}
.ev-header{display:flex;align-items:center;justify-content:space-between;padding:var(--s2) var(--s2) var(--s1)}
.ev-title{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:0 var(--s2) var(--s2)}
.ev-sub{color:var(--c-muted);font-size:14px}
.ev-main{padding:0 var(--s2);display:grid;gap:var(--s2)}
.ev-section-title{font-size:18px;font-weight:600;margin-top:var(--s1)}
.ev-icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ COMPONENTS ============ */
.ev-card{background:var(--c-surface);border-radius:var(--r-card);padding:var(--s2);box-shadow:var(--shadow)}
.ev-card[data-tone="accent"]{background:linear-gradient(135deg,var(--c-accent),#7A5CFF);color:var(--c-on-accent)}
.ev-icon-btn{width:44px;height:44px;border-radius:var(--r-pill);border:0;background:var(--c-surface);color:var(--c-text);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.ev-icon-btn[data-tone="accent"]{background:var(--c-accent-soft);color:var(--c-accent)}
.ev-avatar{width:44px;height:44px;border-radius:var(--r-pill);background:var(--c-accent);color:var(--c-on-accent);display:grid;place-items:center;font-weight:700;border:0;cursor:pointer}
.ev-btn-primary,.ev-btn-ghost{height:48px;padding:0 var(--s3);border-radius:var(--r-pill);font:600 16px var(--font);border:0;cursor:pointer;transition:transform var(--t-fast)}
.ev-btn-primary{background:var(--c-accent);color:var(--c-on-accent)}
.ev-btn-ghost{background:var(--c-accent-soft);color:var(--c-accent)}
.ev-btn-primary:active,.ev-btn-ghost:active{transform:scale(.97)}
.ev-btn-block{width:100%}
.ev-list-item{display:flex;align-items:center;gap:var(--s2);padding:12px 0;border-bottom:1px solid var(--c-line)}
.ev-list-item:last-child{border-bottom:0}
.ev-list-item .grow{flex:1;min-width:0}
.ev-list-item b{display:block;font-weight:500}
.ev-list-item[data-state="done"] b{text-decoration:line-through;color:var(--c-muted)}
.ev-check{width:28px;height:28px;border-radius:var(--r-pill);border:2px solid var(--c-line);background:none;color:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.ev-check[aria-checked="true"]{background:var(--c-ok);border-color:var(--c-ok);color:#fff}
.ev-chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent);white-space:nowrap}
.ev-chip[data-state="late"]{background:#FDECEC;color:var(--c-danger)}
.ev-chip[data-state="soon"]{background:#FFF3E0;color:var(--c-warn)}
.ev-filters{display:flex;gap:var(--s1);overflow-x:auto;padding:0 var(--s2) var(--s2);scrollbar-width:none}
.ev-filters button{height:40px;padding:0 var(--s2);border-radius:var(--r-pill);border:0;background:var(--c-surface);color:var(--c-text);font:500 14px var(--font);white-space:nowrap;cursor:pointer}
.ev-filters button[aria-pressed="true"]{background:var(--c-text);color:var(--c-bg)}
.ev-empty{text-align:center;padding:var(--s4) var(--s2);color:var(--c-muted);display:grid;gap:var(--s1);justify-items:center}
.ev-empty h3{color:var(--c-text);font-size:18px}
.ev-skeleton{height:96px;border-radius:var(--r-card);background:linear-gradient(90deg,var(--c-line),var(--c-surface),var(--c-line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.ev-ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c-accent) calc(var(--p)*1%),var(--c-line) 0);display:grid;place-items:center;flex:none}
.ev-ring span{width:48px;height:48px;border-radius:50%;background:var(--c-surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.ev-row{display:flex;align-items:center;gap:var(--s2)}
.ev-bars{display:flex;gap:6px;align-items:flex-end;height:48px}
.ev-bars i{flex:1;border-radius:6px;background:var(--c-accent-soft);min-height:6px}
.ev-bars i[data-state="hit"]{background:var(--c-accent)}
.ev-days{display:flex;gap:var(--s1);padding:0 var(--s2) var(--s2)}
.ev-days button{flex:1;height:48px;border-radius:16px;border:0;background:var(--c-surface);font:600 14px var(--font);color:var(--c-text);cursor:pointer}
.ev-days button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent)}
.ev-input{width:100%;height:48px;border-radius:16px;border:1.5px solid var(--c-line);background:var(--c-surface);color:var(--c-text);padding:0 var(--s2);font:400 16px var(--font)}
.ev-input:focus{outline:2px solid var(--c-accent);border-color:transparent}
.ev-form{display:grid;gap:var(--s2)}
.ev-bubble-user,.ev-bubble-ai{max-width:85%;padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.5}
.ev-bubble-user{justify-self:end;background:var(--c-accent);color:var(--c-on-accent);border-bottom-right-radius:6px}
.ev-bubble-ai{justify-self:start;background:var(--c-accent-soft);border-bottom-left-radius:6px}
.ev-chat{display:grid;gap:var(--s1);max-height:48vh;overflow-y:auto;padding-bottom:var(--s1)}

/* ปุ่มหลักเดียวต่อหน้า (FAB) */
.ev-fab{position:fixed;right:max(var(--s2),calc(50% - var(--col-max)/2 + var(--s2)));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0) + var(--s2));width:56px;height:56px;border-radius:var(--r-pill);border:0;background:var(--c-accent);color:var(--c-on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(75,47,245,.35);cursor:pointer;z-index:5}

/* แถบนำทาง: แค่ 4 ปุ่ม สะอาดตา */
.ev-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--c-surface) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--c-line);padding-bottom:env(safe-area-inset-bottom,0)}
.ev-nav ul{list-style:none;padding:0;margin:0 auto;max-width:var(--col-max);display:grid;grid-template-columns:repeat(4,1fr)}
.ev-nav button{width:100%;height:var(--nav-h);border:0;background:none;color:var(--c-muted);display:grid;justify-items:center;align-content:center;gap:2px;font:500 11px var(--font);cursor:pointer}
.ev-nav button[aria-current="page"]{color:var(--c-accent)}

/* Bottom sheet (AI / เพิ่ม / นอน / ตั้งค่า) */
.ev-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}
.ev-scrim[data-open="true"]{display:block}
.ev-sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin:0 auto;max-width:var(--col-max);background:var(--c-surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:var(--s2) var(--s2) calc(var(--s3) + env(safe-area-inset-bottom,0));transform:translateY(105%);transition:transform .28s ease;max-height:88%;overflow-y:auto}
.ev-sheet[data-open="true"]{transform:none}
.ev-sheet h2{font-size:20px;margin:0 0 var(--s2);display:flex;justify-content:space-between;align-items:center}
.ev-seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--c-bg);padding:4px;border-radius:16px}
.ev-seg button{height:40px;border:0;border-radius:12px;background:none;color:var(--c-muted);font:600 14px var(--font);cursor:pointer}
.ev-seg button[aria-pressed="true"]{background:var(--c-surface);color:var(--c-accent);box-shadow:var(--shadow)}
.ev-field{display:grid;gap:6px}.ev-field>span{font-size:13px;color:var(--c-muted);font-weight:500}
.ev-row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.ev-bar{height:6px;border-radius:6px;background:var(--c-line);margin-top:6px;overflow:hidden}.ev-bar i{display:block;height:100%;background:var(--c-accent);border-radius:6px}
.ev-step{display:flex;gap:6px}.ev-step button,.ev-mini{height:36px;min-width:36px;border-radius:var(--r-pill);border:0;background:var(--c-accent-soft);color:var(--c-accent);font:700 16px var(--font);cursor:pointer;padding:0 12px}
.ev-week{display:flex;gap:6px;padding:0 var(--s2) var(--s2)}.ev-week button{flex:1;border:0;border-radius:16px;padding:8px 0;background:var(--c-surface);color:var(--c-text);font:500 12px var(--font);display:grid;gap:2px;cursor:pointer}.ev-week b{font-size:16px}
.ev-week button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent)}.ev-week button[data-today="true"] b{text-decoration:underline}
.ev-stat{display:flex;justify-content:space-between;align-items:center}.ev-streak{font-size:28px;font-weight:700;color:var(--c-accent)}
</style>
</head>
<body>
<div class="ev-app" id="app"></div>
<nav class="ev-nav" aria-label="เมนูหลัก"><ul id="nav"></ul></nav>
<button class="ev-fab" id="fab" aria-label="เพิ่ม"></button>
<div class="ev-scrim" id="scrim"></div>
<aside class="ev-sheet" id="sheet" role="dialog" aria-modal="true"></aside>

<script>
/* Path: /js/app.js (เดโมรวมไฟล์เดียว) | Purpose: โมเดลรายการเดียว 4 ชนิด + กฎซ้ำเต็มรูปแบบ + ติดตามผล + สถิติ
   Used by: evarel-demo.html | Layer: Data(store) → Service(occursOn/streak) → Feature(views/form) → UI(h) */

/* ---------- Constants ---------- */
const STORE_KEY = 'evarel-demo-v2', SKELETON_MS = 450, DAY_MS = 86400000, STREAK_LOOKBACK = 365, STAT_DAYS = 30, TIMER_STEP = 5;
const TYPES = { habit: 'กิจวัตร', task: 'งาน', event: 'กิจกรรม', class: 'คาบเรียน' };
const TABS = [['today', 'วันนี้', 'home'], ['all', 'รายการ', 'tasks'], ['schedule', 'ตารางเรียน', 'cal'], ['stats', 'สถิติ', 'chart']];
const WD = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'], WEEK_OPTS = WD.map((l, i) => [i, l]);
const UNIT_TH = { day: 'วัน', week: 'สัปดาห์', month: 'เดือน' };
const REM_OPTS = [[0, 'ตรงเวลา'], [10, '10 นาที'], [30, '30 นาที'], [60, '1 ชม.'], [1440, '1 วัน']];
const TRACK_OPTS = [['check', 'ติ๊ก'], ['count', 'นับเป้า'], ['timer', 'ระยะเวลา']];
const ICONS = {
  home: 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', tasks: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9',
  cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', chart: 'M5 20V10M12 20V4M19 20v-7', spark: 'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',
  plus: 'M12 5v14M5 12h14', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12l5 5 9-10', clock: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 7v5l3 2',
};

/* ---------- Date helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => new Date(`${s}T00:00:00`);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const TODAY = ymd(new Date());

/* ---------- Seed ---------- */
const fill = (days, v) => Object.fromEntries(Array.from({ length: days }, (_, i) => [ymd(addDays(new Date(), -i - 1)), v]));
const base = { subject: '', start: TODAY, end: '', time: '', timeEnd: '', rem: [0], track: 'none', target: 1, unitName: '', log: {} };
const daily = { unit: 'day', every: 1, days: [] };
const cls = (id, d, time, timeEnd, title) => ({ ...base, id, type: 'class', title, time, timeEnd, repeat: { unit: 'week', every: 1, days: [d] } });
const SEED = { items: [
  { ...base, id: 1, type: 'habit', title: 'ดื่มน้ำ', track: 'count', target: 8, unitName: 'แก้ว', repeat: daily, log: fill(6, 8) },
  { ...base, id: 2, type: 'habit', title: 'อ่านหนังสือ', time: '19:00', track: 'timer', target: 30, unitName: 'นาที', repeat: daily, log: { ...fill(3, 30) } },
  { ...base, id: 3, type: 'habit', title: 'นอนก่อน 22:00', time: '22:00', track: 'check', repeat: daily, log: fill(4, 1) },
  { ...base, id: 4, type: 'habit', title: 'วิ่ง', time: '17:00', track: 'check', repeat: { unit: 'week', every: 1, days: [1, 3, 5] } },
  { ...base, id: 5, type: 'task', title: 'การบ้านคณิตศาสตร์', subject: 'คณิต', time: '16:00', track: 'check', repeat: { unit: 'none', every: 1, days: [] } },
  { ...base, id: 6, type: 'event', title: 'ประชุมชมรม', time: '16:30', timeEnd: '17:30', repeat: { unit: 'week', every: 1, days: [4] } },
  cls(7, 1, '08:30', '09:20', 'คณิตศาสตร์'), cls(8, 1, '09:20', '10:10', 'ภาษาไทย'), cls(9, 2, '08:30', '09:20', 'อังกฤษ'),
  cls(10, 3, '08:30', '09:20', 'วิทยาศาสตร์'), cls(11, 4, '09:20', '10:10', 'ศิลปะ'), cls(12, 5, '08:30', '09:20', 'ชุมนุม'),
] };

/* ---------- Data layer ---------- */
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : structuredClone(SEED); }
  catch (err) { console.warn('โหลดข้อมูลไม่สำเร็จ ใช้ข้อมูลตัวอย่าง', err); return structuredClone(SEED); }
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (err) { console.warn('บันทึกไม่สำเร็จ', err); } }
const S = loadState();
const UI = { tab: 'today', date: TODAY, type: 'all', cday: Math.min(Math.max(new Date().getDay(), 1), 5), loading: true };

/* ---------- Service layer ---------- */
function occursOn(it, ds) {
  const d0 = parse(it.start), d = parse(ds), r = it.repeat;
  if (d < d0 || (it.end && d > parse(it.end))) return false;
  if (r.unit === 'none') return ds === it.start;
  if (r.unit === 'day') return Math.round((d - d0) / DAY_MS) % r.every === 0;
  if (r.unit === 'week') return r.days.includes(d.getDay()) && Math.floor(Math.round((d - addDays(d0, -d0.getDay())) / DAY_MS) / 7) % r.every === 0;
  const months = (d.getFullYear() - d0.getFullYear()) * 12 + d.getMonth() - d0.getMonth();
  return d.getDate() === d0.getDate() && months % r.every === 0;
}
const val = (it, ds) => it.log[ds] || 0;
const target = it => (it.track === 'count' || it.track === 'timer' ? it.target : 1);
const tracked = it => it.track !== 'none';
const isDone = (it, ds) => val(it, ds) >= target(it);
const onDate = ds => S.items.filter(it => occursOn(it, ds)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
function streak(it) {
  let n = 0;
  for (let i = 0; i < STREAK_LOOKBACK; i++) {
    const ds = ymd(addDays(new Date(), -i));
    if (!occursOn(it, ds)) continue;
    if (isDone(it, ds)) n++; else if (i > 0) break;
  }
  return n;
}
function rate(it) {
  let total = 0, ok = 0;
  for (let i = 0; i < STAT_DAYS; i++) { const ds = ymd(addDays(new Date(), -i)); if (occursOn(it, ds)) { total++; if (isDone(it, ds)) ok++; } }
  return total ? Math.round(100 * ok / total) : 0;
}
function repeatText(it) {
  const r = it.repeat, tail = it.end ? ` · ถึง ${it.end}` : '';
  if (r.unit === 'none') return `ครั้งเดียว ${it.start}`;
  const every = r.every === 1 ? 'ทุก' : `ทุก ${r.every}`;
  const body = r.unit === 'week' ? `${every} สัปดาห์ (${r.days.map(d => WD[d]).join(' ')})` : `${every} ${UNIT_TH[r.unit]}`;
  return body + tail;
}
const timeText = it => (it.time ? it.time + (it.timeEnd ? `–${it.timeEnd}` : '') : '');

/* ---------- UI primitives ---------- */
const icon = n => `<svg class="ev-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const empty = (t, h) => `<div class="ev-empty"><h3>${t}</h3><p>${h}</p></div>`;
const skeleton = () => `<div class="ev-main"><div class="ev-skeleton"></div><div class="ev-skeleton"></div><div class="ev-skeleton"></div></div>`;
const header = (sub, title) => `<header class="ev-header"><span class="ev-sub">${sub}</span><div class="ev-row">
  <button class="ev-icon-btn" data-tone="accent" data-act="ai" aria-label="ผู้ช่วย AI">${icon('spark')}</button>
  <button class="ev-avatar" data-act="settings" aria-label="ตั้งค่า">J</button></div></header><h1 class="ev-title">${title}</h1>`;
const chipsRow = (act, opts, cur) => `<div class="ev-filters" role="group">${opts.map(([k, l]) => `<button aria-pressed="${cur === k}" data-act="${act}" data-id="${k}">${l}</button>`).join('')}</div>`;

function itemRow(it, ds) {
  const v = val(it, ds), tg = target(it), done = tracked(it) && isDone(it, ds), multi = it.track === 'count' || it.track === 'timer';
  const lead = it.track === 'check'
    ? `<button class="ev-check" role="checkbox" aria-checked="${done}" aria-label="ทำแล้ว" data-act="check" data-id="${it.id}">${icon('check')}</button>`
    : `<span class="ev-chip">${TYPES[it.type]}</span>`;
  const tail = it.track === 'count'
    ? `<div class="ev-step"><button data-act="dec" data-id="${it.id}" aria-label="ลด">−</button><button data-act="inc" data-id="${it.id}" aria-label="เพิ่ม">+</button></div>`
    : it.track === 'timer' ? `<button class="ev-mini" data-act="add5" data-id="${it.id}">+${TIMER_STEP} น.</button>` : '';
  const sub = [timeText(it), multi ? `${v}/${tg} ${it.unitName}` : it.subject].filter(Boolean).join(' · ');
  return `<li class="ev-list-item" data-state="${done ? 'done' : 'todo'}">${lead}<div class="grow"><b>${it.title}</b><span class="ev-sub">${sub}</span>
    ${multi ? `<div class="ev-bar"><i style="width:${Math.min(100, v / tg * 100)}%"></i></div>` : ''}</div>${tail}</li>`;
}

/* ---------- Feature views ---------- */
const VIEWS = {
  today() {
    const list = onDate(UI.date), tr = list.filter(tracked), done = tr.filter(it => isDone(it, UI.date)).length, p = tr.length ? Math.round(100 * done / tr.length) : 0;
    const start = addDays(new Date(), -new Date().getDay());
    const week = Array.from({ length: 7 }, (_, i) => ymd(addDays(start, i)));
    return `${header(new Date(parse(UI.date)).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' }), 'วันนี้')}
    <div class="ev-week" role="group" aria-label="เลือกวัน">${week.map(d => `<button aria-pressed="${UI.date === d}" data-today="${d === TODAY}" data-act="date" data-id="${d}">${WD[parse(d).getDay()]}<b>${parse(d).getDate()}</b></button>`).join('')}</div>
    <main class="ev-main"><section class="ev-card ev-row" data-tone="accent"><div class="ev-ring" style="--p:${p}"><span style="color:var(--c-text)">${p}%</span></div>
      <div class="grow"><b>ทำแล้ว ${done}/${tr.length}</b><p style="opacity:.85;font-size:14px">${list.length - tr.length} รายการที่เป็นตาราง/นัดหมาย</p></div></section>
    <section class="ev-card">${list.length ? `<ul style="padding:0;list-style:none">${list.map(it => itemRow(it, UI.date)).join('')}</ul>` : empty('วันนี้ว่าง', 'กดปุ่ม + เพื่อเพิ่มสิ่งที่อยากทำ')}</section></main>`;
  },
  all() {
    const list = S.items.filter(it => UI.type === 'all' || it.type === UI.type);
    const row = it => `<li class="ev-list-item"><span class="ev-chip">${TYPES[it.type]}</span><div class="grow"><b>${it.title}</b><span class="ev-sub">${repeatText(it)}${it.rem.length ? ` · เตือน ${it.rem.length}` : ''}</span></div>
      <button class="ev-icon-btn" data-act="del" data-id="${it.id}" aria-label="ลบ" style="box-shadow:none">${icon('x')}</button></li>`;
    return `${header('ทุกอย่างที่ตั้งไว้', 'รายการ')}${chipsRow('type', [['all', 'ทั้งหมด'], ...Object.entries(TYPES)], UI.type)}
    <main class="ev-main"><section class="ev-card">${list.length ? `<ul style="padding:0;list-style:none">${list.map(row).join('')}</ul>` : empty('ยังไม่มีรายการ', 'กดปุ่ม + เพื่อสร้าง')}</section></main>`;
  },
  schedule() {
    const date = ymd(addDays(new Date(), UI.cday - new Date().getDay())), list = onDate(date).filter(it => it.type === 'class');
    return `${header('คาบเรียนแต่ละวัน', 'ตารางเรียน')}<div class="ev-week">${[1, 2, 3, 4, 5].map(i => `<button aria-pressed="${UI.cday === i}" data-act="cday" data-id="${i}">${WD[i]}</button>`).join('')}</div>
    <main class="ev-main"><section class="ev-card">${list.length ? list.map(it => `<div class="ev-list-item"><span class="ev-chip">${it.time}</span><div class="grow"><b>${it.title}</b></div><span class="ev-sub">ถึง ${it.timeEnd}</span></div>`).join('') : empty('วันนี้ไม่มีคาบเรียน', 'กด + แล้วเลือก “คาบเรียน”')}</section></main>`;
  },
  stats() {
    const habits = S.items.filter(it => it.type === 'habit');
    const card = it => { const bars = Array.from({ length: 7 }, (_, i) => { const ds = ymd(addDays(new Date(), i - 6)); return `<i data-state="${occursOn(it, ds) && isDone(it, ds) ? 'hit' : 'miss'}" style="height:${occursOn(it, ds) ? 100 : 15}%"></i>`; }).join('');
      return `<section class="ev-card"><div class="ev-stat"><div><b>${it.title}</b><p class="ev-sub">สำเร็จ ${rate(it)}% ใน ${STAT_DAYS} วัน</p></div><div class="ev-streak">${streak(it)}<span class="ev-sub"> วันติด</span></div></div><div class="ev-bars" style="margin-top:12px">${bars}</div></section>`; };
    return `${header('ความต่อเนื่องของคุณ', 'สถิติ')}<main class="ev-main">${habits.length ? habits.map(card).join('') : empty('ยังไม่มีกิจวัตร', 'สร้างกิจวัตรเพื่อดูสถิติ')}</main>`;
  },
};

/* ---------- Sheets ---------- */
const sheetEl = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(title, body) {
  sheetEl.innerHTML = `<h2>${title}<button class="ev-icon-btn" data-act="close" aria-label="ปิด">${icon('x')}</button></h2>${body}`;
  sheetEl.dataset.open = scrim.dataset.open = 'true';
}
const closeSheet = () => { sheetEl.dataset.open = scrim.dataset.open = 'false'; };

/* ---------- Add form (draft D) ---------- */
let D = {};
const newDraft = type => ({ type, title: '', subject: '', start: TODAY, end: '', endMode: 'never', time: '', timeEnd: '', unit: type === 'habit' ? 'day' : 'none', every: 1, days: [], track: 'check', target: 1, unitName: '', rem: [0] });
const seg = (act, opts, cur) => `<div class="ev-seg">${opts.map(([k, l]) => `<button type="button" aria-pressed="${cur === k}" data-act="${act}" data-id="${k}">${l}</button>`).join('')}</div>`;
const chips = (act, opts, arr) => `<div class="ev-filters" style="padding:0;flex-wrap:wrap;overflow:visible">${opts.map(([k, l]) => `<button type="button" aria-pressed="${arr.includes(k)}" data-act="${act}" data-id="${k}">${l}</button>`).join('')}</div>`;
const field = (l, h) => `<label class="ev-field"><span>${l}</span>${h}</label>`;
const inp = (n, t, ph = '') => `<input class="ev-input" name="${n}" type="${t}" value="${D[n] ?? ''}" placeholder="${ph}">`;
const row2 = (a, b) => `<div class="ev-row2">${a}${b}</div>`;
const rangeBlock = () => field('วันเริ่ม', inp('start', 'date')) + seg('dend', [['never', 'ไม่สิ้นสุด'], ['date', 'ถึงวันที่']], D.endMode) + (D.endMode === 'date' ? field('วันสิ้นสุด', inp('end', 'date')) : '');
const repeatBlock = () => seg('dunit', [['none', 'ไม่ซ้ำ'], ['day', 'วัน'], ['week', 'สัปดาห์'], ['month', 'เดือน']], D.unit)
  + (D.unit === 'none' ? field('วันที่', inp('start', 'date')) : field(`ทำซ้ำทุก ๆ กี่ ${UNIT_TH[D.unit]}`, inp('every', 'number')) + (D.unit === 'week' ? field('เลือกวัน', chips('dday', WEEK_OPTS, D.days)) : '') + rangeBlock());
function formHTML() {
  const T = D.type, multi = D.track !== 'check';
  let h = seg('dtype', Object.entries(TYPES), T) + field(T === 'class' ? 'ชื่อวิชา' : 'ชื่อ', inp('title', 'text', T === 'habit' ? 'เช่น ดื่มน้ำ' : ''));
  if (T === 'task') h += field('วิชา/หมวด', inp('subject', 'text')) + row2(field('วันกำหนดส่ง', inp('start', 'date')), field('เวลา', inp('time', 'time')));
  if (T === 'habit') h += field('เวลาที่ควรทำ (ไม่บังคับ)', inp('time', 'time')) + field('วิธีติดตามผล', seg('dtrack', TRACK_OPTS, D.track))
    + (multi ? row2(field('เป้าหมาย', inp('target', 'number')), field('หน่วย', inp('unitName', 'text'))) : '') + repeatBlock();
  if (T === 'event') h += row2(field('เริ่ม', inp('time', 'time')), field('จบ', inp('timeEnd', 'time'))) + repeatBlock();
  if (T === 'class') h += field('วันที่เรียน', chips('dday', WEEK_OPTS, D.days)) + row2(field('เริ่ม', inp('time', 'time')), field('จบ', inp('timeEnd', 'time'))) + rangeBlock();
  return `<form class="ev-form" id="addForm">${h}${field('เตือนล่วงหน้า (เลือกได้หลายอัน)', chips('drem', REM_OPTS, D.rem))}<button class="ev-btn-primary ev-btn-block" type="submit">บันทึก</button></form>`;
}
function renderForm() { const y = sheetEl.scrollTop; openSheet('เพิ่มใหม่', formHTML()); sheetEl.scrollTop = y; }
function buildItem() {
  const T = D.type, week = T === 'class' || D.unit === 'week';
  const days = week ? (D.days.length ? D.days : [parse(D.start).getDay()]) : [];
  const repeat = T === 'task' ? { unit: 'none', every: 1, days: [] } : { unit: T === 'class' ? 'week' : D.unit, every: Math.max(1, +D.every || 1), days };
  const multi = T === 'habit' && D.track !== 'check';
  return { id: Date.now(), type: T, title: D.title.trim(), subject: D.subject, start: D.start, end: D.endMode === 'date' && repeat.unit !== 'none' ? D.end : '', time: D.time, timeEnd: D.timeEnd,
    rem: [...D.rem], repeat, track: T === 'habit' ? D.track : T === 'task' ? 'check' : 'none', target: multi ? Math.max(1, +D.target || 1) : 1, unitName: multi ? D.unitName : '', log: {} };
}
const openAdd = type => { D = newDraft(type); renderForm(); };
const toggle = (arr, v) => { const i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); };

/* ---------- AI mock (การ์ดยืนยันก่อนเพิ่ม) ---------- */
const aiOpen = () => openSheet('ผู้ช่วย AI', `<div class="ev-chat" id="chat"><div class="ev-bubble-ai">ลองพิมพ์ เช่น “เพิ่มงาน การบ้านอังกฤษ”</div></div>
  <div class="ev-row" style="margin-top:12px"><input class="ev-input" id="aiText" placeholder="พิมพ์ข้อความ…" aria-label="ข้อความ"><button class="ev-btn-primary" data-act="send">ส่ง</button></div>`);
function aiSend() {
  const inpEl = document.getElementById('aiText'), text = inpEl.value.trim(), chat = document.getElementById('chat');
  if (!text) return;
  const name = text.replace('เพิ่มงาน', '').trim() || 'งานใหม่';
  chat.insertAdjacentHTML('beforeend', '<div class="ev-bubble-user"></div>'); chat.lastElementChild.textContent = text; inpEl.value = '';
  chat.insertAdjacentHTML('beforeend', text.includes('เพิ่มงาน')
    ? `<div class="ev-card" style="background:var(--c-accent-soft);box-shadow:none"><b>เพิ่มงาน “${name.replace(/</g, '&lt;')}” ส่งพรุ่งนี้?</b><div class="ev-row" style="margin-top:8px"><button class="ev-btn-primary" data-act="ai-ok" data-id="${encodeURIComponent(name)}">ยืนยัน</button><button class="ev-btn-ghost" data-act="close">ยกเลิก</button></div></div>`
    : '<div class="ev-bubble-ai">รับทราบ (เดโม: ลองพิมพ์ “เพิ่มงาน …”)</div>');
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- Actions ---------- */
const find = id => S.items.find(x => x.id == id);
const bump = (id, n) => { const it = find(id); if (it) it.log[UI.date] = Math.max(0, val(it, UI.date) + n); };
const FORM = 'form';
const ACTIONS = {
  check: id => { const it = find(id); if (it) it.log[UI.date] = isDone(it, UI.date) ? 0 : 1; },
  inc: id => bump(id, 1), dec: id => bump(id, -1), add5: id => bump(id, TIMER_STEP),
  date: id => { UI.date = id; }, type: id => { UI.type = id; }, cday: id => { UI.cday = +id; },
  del: id => { S.items = S.items.filter(x => x.id != id); },
  ai: aiOpen, send: aiSend, close: closeSheet,
  settings: () => openSheet('ตั้งค่า', '<div class="ev-form"><button class="ev-btn-ghost ev-btn-block" data-act="notify">เปิดการแจ้งเตือน</button><p class="ev-sub">การแจ้งเตือนจริงต้องใช้ Push จากฝั่ง Server (เฟสถัดไป)</p></div>'),
  notify: () => { if ('Notification' in window) Notification.requestPermission(); },
  'ai-ok': id => { openAdd('task'); D.title = decodeURIComponent(id); D.start = ymd(addDays(new Date(), 1)); renderForm(); },
  dtype: id => { D = { ...newDraft(id), title: D.title }; return FORM; },
  dunit: id => { D.unit = id; return FORM; }, dend: id => { D.endMode = id; return FORM; },
  dtrack: id => { D.track = id; D.target = id === 'timer' ? 30 : 8; D.unitName = id === 'timer' ? 'นาที' : 'แก้ว'; return FORM; },
  dday: id => { toggle(D.days, +id); return FORM; }, drem: id => { toggle(D.rem, +id); return FORM; },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const res = ACTIONS[el.dataset.act]?.(el.dataset.id);
  saveState();
  if (res === FORM) renderForm(); else render();
});
document.addEventListener('input', e => { if (e.target.closest('#addForm') && e.target.name in D) D[e.target.name] = e.target.value; });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (!D.title.trim() || !D.start) return;
  S.items.push(buildItem()); saveState(); closeSheet(); render();
});
scrim.addEventListener('click', closeSheet);
document.getElementById('fab').addEventListener('click', () => openAdd(UI.tab === 'schedule' ? 'class' : 'habit'));
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { UI.tab = b.dataset.tab; render(); scrollTo(0, 0); } });

/* ---------- Render ---------- */
function render() {
  document.getElementById('app').innerHTML = UI.loading ? skeleton() : VIEWS[UI.tab]();
  document.getElementById('nav').innerHTML = TABS.map(([id, label, ic]) => `<li><button data-tab="${id}" ${UI.tab === id ? 'aria-current="page"' : ''}>${icon(ic)}${label}</button></li>`).join('');
  document.getElementById('fab').innerHTML = icon('plus');
}
render();
setTimeout(() => { UI.loading = false; render(); }, SKELETON_MS);
</script>
</body>
</html>
