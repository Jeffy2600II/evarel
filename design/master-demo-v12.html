<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B2FF5">
<title>Evarel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Path: design/master-demo-v3.html | Purpose: เดโมต้นแบบ UX ระดับแอป (ไฟล์เดียว) — โทเคนตรงกับ app/styles/tokens.css
   Used by: เป็นแบบอ้างอิงให้ agent ย้ายเข้า app/ (ส่วน CSS → app.css, ส่วน JS แยกตามหัวข้อ "MODULE:") */

/* ============ TOKENS ============ */
:root{
  --font:'IBM Plex Sans Thai',system-ui,sans-serif;
  --c-bg:#F7F7F9;--c-surface:#fff;--c-text:#14141A;--c-muted:#6A6A77;--c-line:#E8E8ED;--c-fill:#EDEDF1;--c-on-ink-soft:rgba(255,255,255,.2);
  --c-accent:#4B2FF5;--c-accent-text:#4B2FF5;--c-accent-soft:#EEEBFF;--c-accent-2:#7A5CFF;--c-on-accent:#fff;
  --c-ok:#18A66A;--c-on-ok:#fff;--c-warn:#E8890C;--c-danger:#E5484D;--c-danger-soft:#FDECEC;--c-warn-soft:#FFF3E0;--c-scrim:rgba(10,10,20,.45);
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;
  --r-card:26px;--r-pill:999px;--r-sheet:32px;
  --shadow:0 0 0 1px rgba(20,20,26,.035);--dock:calc(var(--nav-h) + env(safe-area-inset-bottom,0) + 10px);--shadow-fab:0 6px 20px rgba(75,47,245,.35);
  --t-fast:.18s;--t-med:.32s;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --nav-h:60px;--col-max:480px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-bg:#0E0E12;--c-surface:#1A1A21;--c-text:#F2F2F5;--c-muted:#9A9AA8;--c-line:#2A2A33;--c-fill:#262630;--c-on-ink-soft:rgba(0,0,0,.14);--c-accent:#6E5BEF;--c-accent-text:#9585FF;--c-accent-soft:#25214A;--c-accent-2:#9A8AFF;--shadow:none;--shadow-fab:0 6px 20px rgba(0,0,0,.5);--c-danger-soft:#3A1E21;--c-warn-soft:#3A2D14}}
:root[data-theme="dark"]{--c-bg:#0E0E12;--c-surface:#1A1A21;--c-text:#F2F2F5;--c-muted:#9A9AA8;--c-line:#2A2A33;--c-fill:#262630;--c-on-ink-soft:rgba(0,0,0,.14);--c-accent:#6E5BEF;--c-accent-text:#9585FF;--c-accent-soft:#25214A;--c-accent-2:#9A8AFF;--shadow:none;--shadow-fab:0 6px 20px rgba(0,0,0,.5);--c-danger-soft:#3A1E21;--c-warn-soft:#3A2D14}
@property --p{syntax:'<number>';inherits:false;initial-value:0}

/* ============ BASE / LAYOUT ============ */
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;line-height:1.45;font-size:15px}
button,input,select{font-family:inherit;color:inherit}
button{padding:0}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
body[data-lock="true"]{position:fixed;left:0;right:0;width:100%;overflow:hidden}
[inert]{pointer-events:none}
[hidden]{display:none!important}
.ev-app{max-width:var(--col-max);margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top,0) 0 calc(var(--dock) + 76px)}
.ev-header{display:flex;align-items:center;justify-content:space-between;padding:var(--s2) var(--s2) 4px}
.ev-title{font-size:28px;font-weight:700;letter-spacing:-.4px;padding:0 var(--s2) 12px;line-height:1.25}
.ev-sub{color:var(--c-muted);font-size:14px}
.ev-main{padding:0 var(--s2);display:grid;gap:var(--s2)}
.ev-section-title{font-size:18px;font-weight:600;margin-top:var(--s1)}
.ev-group{font-size:12px;font-weight:600;color:var(--c-muted);letter-spacing:.04em;padding:12px 0 2px}
.ev-icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ev-row{display:flex;align-items:center;gap:var(--s2)}.ev-row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.grow{flex:1;min-width:0}
ul{list-style:none;padding:0}

/* ============ COMPONENTS ============ */
.ev-card{background:var(--c-surface);border-radius:var(--r-card);padding:var(--s2);box-shadow:var(--shadow)}
.ev-card[data-tone="ink"]{background:var(--c-text);color:var(--c-bg);box-shadow:none}.ev-card[data-tone="ink"] .ev-chip{background:var(--c-on-ink-soft);color:var(--c-bg)}
.ev-card[data-tone="warn"]{background:var(--c-warn-soft);box-shadow:none}
.ev-icon-btn{width:40px;height:40px;border-radius:var(--r-pill);border:0;background:var(--c-surface);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform var(--t-fast) var(--ease)}
.ev-icon-btn[data-tone="accent"]{background:var(--c-accent-soft);color:var(--c-accent-text)}
.ev-icon-btn[data-flat]{box-shadow:none;background:none;width:40px;height:40px;color:var(--c-muted)}
.ev-avatar{width:40px;height:40px;border-radius:var(--r-pill);border:0;background:var(--c-accent);color:var(--c-on-accent);font-weight:700;font-size:15px}
.ev-btn-primary,.ev-btn-ghost,.ev-btn-danger{height:48px;padding:0 22px;border-radius:var(--r-pill);font:600 15px var(--font);border:0;transition:transform var(--t-fast) var(--ease),opacity var(--t-fast)}
.ev-btn-primary{background:var(--c-accent);color:var(--c-on-accent)}
.ev-btn-ghost{background:var(--c-fill);color:var(--c-text)}
.ev-btn-danger{background:var(--c-danger-soft);color:var(--c-danger)}
.ev-btn-block{width:100%}.ev-btn-sm{height:36px;padding:0 var(--s2);font-size:14px}
:is(.ev-btn-primary,.ev-btn-ghost,.ev-btn-danger,.ev-icon-btn,.ev-mini,.ev-step button):active{transform:scale(.94)}
.ev-btn-primary:disabled{opacity:.45}
.ev-list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--c-line);position:relative}
.ev-list-item:last-child{border-bottom:0}
.ev-list-item b{display:block;font-weight:500;transition:color var(--t-med)}
.ev-list-item[data-state="done"] b{color:var(--c-muted);text-decoration:line-through;text-decoration-color:var(--c-muted)}
.ev-list-item[data-next="true"]::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--c-accent)}
.ev-check{width:26px;height:26px;padding:0;border-radius:var(--r-pill);border:1.5px solid var(--c-line);background:none;color:transparent;display:grid;place-items:center;flex:none;transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.ev-check svg{display:block;width:14px;height:14px;stroke-width:3.2;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s}
.ev-check[aria-checked="true"]{background:var(--c-ok);border-color:var(--c-ok);color:var(--c-on-ok)}
.ev-check[aria-checked="true"] svg{stroke-dashoffset:0}
.ev-check[data-pop="true"]{animation:pop .45s var(--spring)}
.ev-check:disabled{opacity:.4}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.ev-chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:var(--r-pill);background:var(--c-fill);color:var(--c-muted);white-space:nowrap}
.ev-chip[data-state="late"]{background:var(--c-danger-soft);color:var(--c-danger)}.ev-chip[data-state="soon"]{background:var(--c-warn-soft);color:var(--c-warn)}.ev-chip[data-state="ok"]{background:var(--c-bg);color:var(--c-muted)}
.ev-filters{display:flex;gap:var(--s1);overflow-x:auto;padding:0 var(--s2) var(--s2);scrollbar-width:none}.ev-filters::-webkit-scrollbar{display:none}
.ev-filters button{height:36px;padding:0 16px;border-radius:var(--r-pill);border:0;background:var(--c-surface);font:500 14px var(--font);white-space:nowrap;transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast)}
.ev-filters button[aria-pressed="true"]{background:var(--c-text);color:var(--c-bg)}
.ev-filters button:active{transform:scale(.95)}
.ev-wrap{padding:0;flex-wrap:wrap;overflow:visible}
.ev-empty{text-align:center;padding:var(--s4) var(--s2);color:var(--c-muted);display:grid;gap:var(--s1);justify-items:center}
.ev-empty h3{color:var(--c-text);font-size:18px}
.ev-empty .orb{width:72px;height:72px;border-radius:50%;background:var(--c-fill);color:var(--c-muted);display:grid;place-items:center;margin-bottom:8px}.ev-empty .orb svg{width:28px;height:28px}
.ev-skeleton{height:96px;border-radius:var(--r-card);background:linear-gradient(90deg,var(--c-line),var(--c-surface),var(--c-line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.ev-bar{height:6px;border-radius:6px;background:var(--c-line);margin-top:6px;overflow:hidden}.ev-bar i{display:block;width:0;height:100%;background:var(--c-accent);border-radius:6px;transition:width .5s var(--ease)}
.ev-bar i[data-full="true"]{background:var(--c-ok)}
.ev-step{display:flex;gap:6px}
.ev-step button,.ev-mini{height:34px;min-width:34px;border-radius:var(--r-pill);border:0;background:var(--c-fill);color:var(--c-text);font:700 17px var(--font);padding:0 12px;display:grid;place-items:center;transition:transform var(--t-fast) var(--ease)}
.ev-mini[data-tone="solid"]{background:var(--c-accent);color:var(--c-on-accent)}
.ev-step button:disabled{opacity:.35}
.ev-week{display:flex;gap:6px;padding:0 var(--s2) var(--s2)}
.ev-week button{flex:1;border:0;border-radius:22px;padding:7px 0;background:var(--c-surface);font:500 12px var(--font);display:grid;gap:2px;transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease)}
.ev-week b{font-size:16px}.ev-week button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent);transform:translateY(-2px)}
.ev-week button[data-today="true"]:not([aria-pressed="true"]) b{color:var(--c-accent-text)}
.ev-stat{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}.ev-streak{font-size:26px;font-weight:700;color:var(--c-accent-text);text-align:right;line-height:1}
.ev-bars{display:flex;gap:6px;align-items:flex-end;height:56px;margin-top:14px}
.ev-bars i{flex:1;border-radius:6px;background:var(--c-line);min-height:6px;transform-origin:bottom}
.ev-bars i[data-state="hit"]{background:var(--c-accent)}.ev-bars i[data-state="off"]{background:var(--c-bg)}
.ev-seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--c-fill);padding:4px;border-radius:var(--r-pill)}
.ev-seg button{height:36px;border:0;border-radius:var(--r-pill);background:none;color:var(--c-muted);font:600 14px var(--font);transition:background var(--t-fast),color var(--t-fast)}
.ev-seg button[aria-pressed="true"]{background:var(--c-surface);color:var(--c-text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ev-form{display:grid;gap:var(--s2)}.ev-field{display:grid;gap:6px}.ev-field>span{font-size:13px;color:var(--c-muted);font-weight:500}
.ev-input{width:100%;height:46px;border-radius:18px;border:1.5px solid var(--c-line);background:var(--c-surface);padding:0 var(--s2);font:400 16px var(--font);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.ev-input:focus{outline:0;border-color:var(--c-accent);box-shadow:0 0 0 4px var(--c-accent-soft)}
.ev-form-err{background:var(--c-danger-soft);color:var(--c-danger);padding:12px var(--s2);border-radius:16px;font-size:14px;font-weight:500;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ev-rem{display:flex;flex-wrap:wrap;gap:6px}.ev-rem-tag{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 6px 0 14px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent-text);font-size:13px;font-weight:600;animation:pop .35s var(--spring)}
.ev-rem-tag button{border:0;background:none;width:26px;height:26px;display:grid;place-items:center;color:inherit}.ev-rem-tag svg{width:14px;height:14px}
.ev-live{position:fixed;z-index:7;left:50%;bottom:calc(var(--dock) + 10px);transform:translate(-50%,24px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:var(--r-pill);border:0;background:var(--c-text);color:var(--c-bg);font:500 14px var(--font);box-shadow:var(--shadow);max-width:calc(100% - 140px);transition:opacity var(--t-med) var(--ease),transform var(--t-med) var(--ease)}
.ev-live[data-show="true"]{opacity:1;transform:translate(-50%,0);pointer-events:auto}.ev-live i{width:8px;height:8px;border-radius:50%;background:var(--c-ok);animation:blink 1.2s infinite}.ev-live[data-run="false"] i{animation:none;background:var(--c-warn)}
.ev-live span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev-live b{font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.3}}
.ev-nav{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),calc(var(--col-max) - 24px));bottom:calc(10px + env(safe-area-inset-bottom,0));z-index:6;background:var(--c-surface);border-radius:34px;box-shadow:0 10px 36px rgba(20,20,30,.14),0 0 0 1px var(--c-line)}
.ev-nav ul{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.ev-nav li{display:grid;place-items:center}
.ev-nav button{width:100%;height:var(--nav-h);border:0;background:none;color:var(--c-muted);display:grid;justify-items:center;align-content:center;gap:2px;font:500 11px var(--font);transition:color var(--t-fast)}
.ev-nav .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background var(--t-med) var(--ease)}
.ev-nav .pill svg{width:22px;height:22px}
.ev-nav button[aria-current="page"]{color:var(--c-text);font-weight:600}.ev-nav button[aria-current="page"] .pill{background:var(--c-fill)}
.ev-nav .add{width:46px;height:46px;border-radius:50%;background:var(--c-accent);color:var(--c-on-accent);display:grid;place-items:center;box-shadow:var(--shadow-fab);transition:transform var(--t-med) var(--spring)}
.ev-nav .add:active{transform:scale(.9)}.ev-nav .add svg{width:22px;height:22px;stroke-width:2.4}

/* Layers: scrim / sheet / page / menu / toast */
.ev-scrim{position:fixed;inset:0;background:var(--c-scrim);z-index:23;opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease)}
.ev-scrim[data-open="true"]{opacity:1;pointer-events:auto}
.ev-sheet{position:fixed;left:0;right:0;bottom:0;z-index:24;margin:0 auto;max-width:var(--col-max);max-height:90dvh;display:flex;flex-direction:column;background:var(--c-surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(105%);transition:transform .42s var(--ease);will-change:transform;box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.ev-sheet[data-open="true"]{transform:none}.ev-sheet[data-drag="true"]{transition:none}
.ev-grab{padding:10px 0 4px;touch-action:none;cursor:grab}.ev-grab::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--c-line);margin:0 auto}
.ev-sheet h2{font-size:18px;padding:4px 12px 8px var(--s2);display:flex;gap:8px;justify-content:space-between;align-items:center;touch-action:none}
.ev-sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:var(--s1) var(--s2) var(--s3)}.ev-sheet-body:last-child{padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom,0))}
.ev-page{position:fixed;inset:0;z-index:22;background:var(--c-bg);display:flex;flex-direction:column;align-items:center;transform:translateY(24px) scale(.98);opacity:0;transition:transform .4s var(--ease),opacity .25s;pointer-events:none}
.ev-page[data-open="true"]{transform:none;opacity:1;pointer-events:auto}
.ev-page>*{width:100%;max-width:var(--col-max)}
.ev-page-bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0) + 12px) var(--s2) 8px}.ev-page-bar h2{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev-page-bar h2[role="button"]{cursor:pointer}
.ev-page-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--s1) var(--s2) calc(var(--s4) + env(safe-area-inset-bottom,0));display:grid;gap:var(--s2);align-content:start}
.ev-toast{position:fixed;left:50%;z-index:30;bottom:calc(var(--dock) + 66px);width:min(calc(100% - 32px),calc(var(--col-max) - 32px));transform:translate(-50%,20px) scale(.96);opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:6px 6px 6px var(--s2);min-height:52px;border-radius:var(--r-pill);background:var(--c-text);color:var(--c-bg);font-size:14px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.25);transition:opacity var(--t-fast),transform .35s var(--spring);overflow:hidden}
.ev-toast[data-open="true"]{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ev-toast button{height:40px;padding:0 var(--s2);border-radius:var(--r-pill);border:0;background:var(--c-on-ink-soft);color:inherit;font:600 14px var(--font)}
.ev-toast::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--c-accent-2);width:100%;transform-origin:left;transform:scaleX(0)}
.ev-toast[data-open="true"]::after{animation:drain var(--toast-ms,5s) linear forwards}@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* Focus timer */
.ev-dial{--p:0;position:relative;width:min(76vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c-accent) calc(var(--p)*1%),var(--c-line) 0);margin:var(--s3) auto;transition:--p .9s linear}
.ev-dial::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--c-surface);box-shadow:var(--shadow)}
.ev-dial-face{position:relative;display:grid;justify-items:center;gap:4px}.ev-digits{font:700 clamp(42px,13vw,58px)/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ev-dial[data-run="true"]{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.02)}}
.ev-round{width:72px;height:72px;border-radius:50%;border:0;background:var(--c-accent-soft);color:var(--c-accent-text);display:grid;place-items:center;transition:transform var(--t-fast) var(--ease)}.ev-round:active{transform:scale(.9)}
.ev-round[data-big="true"]{width:88px;height:88px;background:var(--c-accent);color:var(--c-on-accent);box-shadow:var(--shadow-fab)}.ev-round svg{width:30px;height:30px;fill:currentColor}
.ev-focus-actions{display:flex;justify-content:center;align-items:center;gap:var(--s3)}

/* AI chat */
.ev-chat{display:grid;gap:10px;align-content:start}
.ev-bubble-user,.ev-bubble-ai{max-width:86%;padding:12px 16px;border-radius:20px;font-size:15px;white-space:pre-wrap;animation:rise .35s var(--ease)}
.ev-bubble-user{justify-self:end;background:var(--c-accent);color:var(--c-on-accent);border-bottom-right-radius:6px}.ev-bubble-ai{justify-self:start;background:var(--c-surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.ev-typing{display:inline-flex;gap:4px;padding:16px 18px}.ev-typing i{width:7px;height:7px;border-radius:50%;background:var(--c-muted);animation:bounce 1s infinite}.ev-typing i:nth-child(2){animation-delay:.15s}.ev-typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-5px);opacity:.5}}
.ev-compose{display:flex;gap:8px;padding:8px var(--s2) calc(8px + env(safe-area-inset-bottom,0));background:var(--c-bg)}.ev-compose .ev-input{border-radius:var(--r-pill)}

.ev-card[data-tone="soft"]{background:var(--c-fill);box-shadow:none}
.ev-badge{width:28px;height:28px;border-radius:50%;background:var(--c-fill);color:var(--c-text);display:grid;place-items:center;flex:none}.ev-badge svg{width:14px;height:14px}
/* Form */
.ev-sheet-foot{padding:12px var(--s2) calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid var(--c-line)}

.ev-row-input{border:0;background:none;font:500 15px var(--font);color:var(--c-accent-text);text-align:right;height:44px;min-width:0;max-width:60%}.ev-row-input:focus{outline:0;text-decoration:underline}
.ev-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}.ev-panel[data-open="true"]{grid-template-rows:1fr}.ev-panel>div{overflow:hidden;min-height:0}

.ev-step{align-items:center}

.ev-switch{width:46px;height:28px;border-radius:14px;border:0;background:var(--c-line);position:relative;transition:background var(--t-fast)}
.ev-switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.ev-switch[aria-checked="true"]{background:var(--c-accent)}.ev-switch[aria-checked="true"]::after{transform:translateX(18px)}
/* AI + ประวัติแชท */

body{font-variant-numeric:tabular-nums}
.ev-ai-pill{height:36px;padding:0 14px 0 11px;border-radius:var(--r-pill);border:0;background:var(--c-fill);display:flex;align-items:center;gap:6px;font:600 13px var(--font);transition:transform var(--t-fast) var(--ease)}.ev-ai-pill svg{width:18px;height:18px}.ev-ai-pill:active{transform:scale(.95)}
.ev-sum{display:grid;gap:16px;padding:22px}
.ev-sum-top{display:flex;align-items:flex-end;justify-content:space-between}
.ev-sum-num{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1}.ev-sum-num small{font-size:20px;opacity:.45;font-weight:600;letter-spacing:0}.ev-sum-lab{font-size:13px;opacity:.65}

.ev-pop button:active{background:var(--c-fill)}.ev-pop button svg{width:20px;height:20px;color:var(--c-muted)}.ev-pop button small{margin-left:auto;color:var(--c-muted);font-size:12px}
.ev-pop button[data-tone="danger"],.ev-pop button[data-tone="danger"] svg{color:var(--c-danger)}.ev-pop hr{border:0;border-top:1px solid var(--c-line);margin:4px 10px}

.ev-dialog[data-open="true"]{opacity:1;pointer-events:auto}
.ev-dialog-card{width:min(100%,340px);background:var(--c-surface);border-radius:28px;padding:24px 20px 20px;display:grid;gap:8px;transform:scale(.94);transition:transform .3s var(--spring)}
.ev-dialog[data-open="true"] .ev-dialog-card{transform:none}.ev-dialog-card h3{font-size:18px;font-weight:600}
.ev-dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ev-btn-solid-danger{height:48px;border-radius:var(--r-pill);border:0;background:var(--c-danger);color:#fff;font:600 15px var(--font)}
.ev-btn-ink{height:48px;padding:0 22px;border-radius:var(--r-pill);border:0;background:var(--c-text);color:var(--c-bg);font:600 15px var(--font);display:flex;align-items:center;gap:8px}.ev-btn-ink svg{width:18px;height:18px}

.ev-ai-mark{width:52px;height:52px;color:var(--c-accent)}.ev-ai-hello h3{font-size:26px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.ev-sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}.ev-sugg button{height:38px;padding:0 16px;border-radius:var(--r-pill);border:0;background:var(--c-fill);font:500 13.5px var(--font)}
.ev-composer{margin:0 12px calc(12px + env(safe-area-inset-bottom,0));width:calc(100% - 24px);padding:10px 10px 10px 16px;border-radius:30px;background:var(--c-surface);box-shadow:0 8px 30px rgba(20,20,30,.12),0 0 0 1px var(--c-line);display:grid;gap:4px}

.ev-composer-bar{display:flex;align-items:center;justify-content:space-between}
.ev-plus{width:40px;height:40px;border-radius:50%;border:0;background:var(--c-fill);display:grid;place-items:center}

.ev-drawer-scrim{position:absolute;inset:0;z-index:2;background:rgba(10,10,20,.45);opacity:0;pointer-events:none;transition:opacity .3s;max-width:none!important}.ev-drawer-scrim[data-open="true"]{opacity:1;pointer-events:auto}

.ev-chat-row>button:first-child svg{width:18px;height:18px;color:var(--c-muted);flex:none}.ev-chat-row b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-drawer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0))}

.ev-list-item>.ev-icon{width:18px;height:18px;color:var(--c-muted)}.ev-card[role="button"]{cursor:pointer}

.ev-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ev-cal-head b{font-size:16px}
.ev-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--c-muted);margin-top:12px}.ev-legend span{display:flex;align-items:center;gap:6px}
.ev-legend i{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--c-fill)}.ev-legend i[data-state="done"]{background:var(--c-ok)}.ev-legend i[data-state="part"]{background:rgba(24,166,106,.22)}.ev-legend i[data-state="off"]{background:none;border:1.5px solid var(--c-line)}
.ev-big{font-size:28px;font-weight:700;letter-spacing:-.5px}.ev-big small{font-size:15px;color:var(--c-muted);font-weight:500}.ev-pct{font-weight:600;font-size:14px;min-width:38px;text-align:right}

/* สถิติรูปแบบใหม่: วงแหวน + กราฟแท่งมีป้ายกำกับ */
.ev-sum-row{display:flex;align-items:center;gap:20px}
.ev-ringbox{position:relative;width:116px;height:116px;flex:none}.ev-ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}

.ev-chart{display:flex;gap:8px;align-items:stretch;margin-top:14px}
.ev-col{flex:1;display:grid;grid-template-rows:auto 96px auto;gap:6px;justify-items:center;font-size:11px;color:var(--c-muted)}
.ev-col-v{font-weight:600;color:var(--c-text)}.ev-col-track{width:100%;max-width:34px;border-radius:12px;background:var(--c-fill);overflow:hidden;display:flex;align-items:flex-end}

.ev-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}.ev-sec-head .ev-group{padding:0}.ev-sec-head .ev-group span{margin-left:6px;font-weight:500;opacity:.7}
.ev-link-btn{width:32px;height:32px;border-radius:50%;border:0;background:var(--c-fill);display:grid;place-items:center;transition:transform var(--t-fast) var(--ease)}.ev-link-btn svg{width:16px;height:16px}.ev-link-btn:active{transform:scale(.9)}
.ev-list-item .grow[role="button"]{transition:opacity var(--t-fast)}.ev-list-item .grow[role="button"]:active{opacity:.55}
.ev-card[role="button"]{transition:transform var(--t-fast) var(--ease)}.ev-card[role="button"]:active{transform:scale(.985)}
.ev-nav button[aria-current="page"] .pill svg{transform:translateY(-1px) scale(1.08)}.ev-nav .pill svg{transition:transform .3s var(--spring)}

.fc .ev-fcday.st-off .ev-dnum{opacity:.35}.fc .ev-fcday.st-future .ev-dnum{opacity:.65}.fc .ev-fcday.st-off,.fc .ev-fcday.st-future{cursor:default}

.fc .fc-event.ev-fc-task{background:var(--c-warn-soft);color:var(--c-warn)}.fc .fc-event.ev-fc-habit{background:rgba(24,166,106,.16);color:var(--c-ok)}.fc .fc-event.is-done{opacity:.5;text-decoration:line-through}

.ev-fc-wrap{padding:8px}.ev-cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ev-cal-title{font-size:18px;font-weight:600;min-width:150px;text-align:center}
.ev-chip-btn{height:32px;padding:0 14px;border-radius:var(--r-pill);border:0;background:var(--c-fill);font:600 13px var(--font);transition:transform var(--t-fast) var(--ease)}.ev-chip-btn:active{transform:scale(.94)}

/* หน้าเข้าสู่ระบบ / สร้างบัญชี */

.ev-auth-in>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.ev-hero{position:relative;height:38vh;min-height:240px;max-height:340px;display:grid;place-items:center;margin:0 -24px;overflow:hidden}
.ev-rings{position:absolute;inset:0;width:100%;height:100%;color:var(--c-muted)}.ev-rings circle{fill:none;stroke:currentColor;transform-box:fill-box;transform-origin:center;animation:ringin 1.1s var(--ease) both}

.ev-auth-body{display:grid;gap:22px}.ev-stack{display:grid;gap:12px}

/* ===== MODULE: core/constants ===== */
const STORE_KEY='evarel-demo-v3',TIMER_KEY='evarel-timer-v3',THEME_KEY='evarel-theme-v3';
const DAY_MS=86400000,TOAST_MS=5000,SKELETON_MS=450,STREAK_LOOKBACK=365,STAT_DAYS=30,DRAG_CLOSE_PX=110,DRAG_CLOSE_V=.6,HAPTIC_MS=10,LONG_PRESS_MS=450,LAYER_ANIM_MS=420,MAX_REM=8;

/* ===== MODULE: core/dates ===== */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>new Date(`${s}T00:00:00`);
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const TODAY=ymd(new Date());
const fmtDate=ds=>{const d=parse(ds);return `${TH_DAY[d.getDay()]}ที่ ${d.getDate()} ${TH_MON[d.getMonth()]}`};
const nowHM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtClock=ms=>{const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`};
const haptic=()=>{try{navigator.vibrate?.(HAPTIC_MS)}catch(e){console.warn('haptic',e)}};

/* ===== MODULE: core/store ===== */
const mk=o=>({id:o.id,type:'habit',title:'',subject:'',start:TODAY,end:'',time:'',timeEnd:'',rem:[{k:'before',m:0}],track:'none',target:1,unitName:'',repeat:{unit:'none',every:1,days:[]},log:{},skip:{},...o});
const fill=(n,v)=>Object.fromEntries(Array.from({length:n},(_,i)=>[ymd(addDays(new Date(),-i-1)),v]));
const daily=()=>({unit:'day',every:1,days:[]}),weekly=d=>({unit:'week',every:1,days:d});
const cls=(id,d,t,te,title)=>mk({id,type:'class',title,time:t,timeEnd:te,repeat:weekly([d])});
const seed=()=>({items:[
 mk({id:1,title:'ดื่มน้ำ',track:'count',target:8,unitName:'แก้ว',repeat:daily(),log:fill(6,8),start:ymd(addDays(new Date(),-10))}),
 mk({id:2,title:'อ่านหนังสือ',time:'19:00',track:'timer',target:30,unitName:'นาที',repeat:daily(),log:fill(3,30),start:ymd(addDays(new Date(),-10))}),
 mk({id:3,title:'นอนก่อน 22:00',time:'22:00',track:'check',repeat:daily(),log:fill(4,1),start:ymd(addDays(new Date(),-10))}),
 mk({id:4,title:'วิ่ง',time:'17:00',track:'check',repeat:weekly([1,3,5]),start:ymd(addDays(new Date(),-10)),log:Object.fromEntries(Array.from({length:5},(_,i)=>[ymd(addDays(new Date(),-i*2-1)),1]))}),
 mk({id:5,type:'task',title:'การบ้านคณิตศาสตร์',subject:'คณิต',time:'16:00',track:'check'}),
 mk({id:6,type:'task',title:'ท่องคำศัพท์ Unit 4',subject:'อังกฤษ',time:'20:00',track:'check',start:ymd(addDays(new Date(),-1))}),
 mk({id:7,type:'task',title:'รายงานวิทยาศาสตร์',subject:'วิทย์',track:'check',start:ymd(addDays(new Date(),2))}),
 mk({id:8,type:'event',title:'ประชุมชมรม',time:'16:30',timeEnd:'17:30',repeat:weekly([4])}),
 cls(9,1,'08:30','09:20','คณิตศาสตร์'),cls(10,1,'09:20','10:10','ภาษาไทย'),cls(11,2,'08:30','09:20','อังกฤษ'),cls(12,3,'08:30','09:20','วิทยาศาสตร์'),cls(13,4,'09:20','10:10','ศิลปะ'),cls(14,5,'08:30','09:20','ชุมนุม')]});
/* ===== MODULE: data/repo — จุดต่อ backend: เปลี่ยน `Repo` ตัวเดียว (UI ไม่รู้ว่าข้อมูลมาจากไหน) =====
   สัญญา adapter: load():Promise<{items}> · apply({upserts:Item[],removes:id[]},fullState):Promise<void> (โยน error เมื่อบันทึกไม่สำเร็จ) */
let USER=null;const uk=k=>`${k}:${USER?.id||'anon'}`;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const LocalAdapter={
 async load(){try{const r=localStorage.getItem(uk(STORE_KEY)),s=r?JSON.parse(r):{items:[]};if(!Array.isArray(s.items))throw new Error('bad shape');return s}catch(err){console.warn('โหลดข้อมูลไม่สำเร็จ',err);return {items:[]}}},
 async apply(changes,full){localStorage.setItem(uk(STORE_KEY),JSON.stringify(full))}};
const HttpAdapter=base=>{const call=(url,o)=>fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...o}).then(r=>{if(!r.ok)throw new Error(`${o?.method||'GET'} ${url} ${r.status}`);return r});
 return {async load(){return {items:(await (await call(`${base}/items`)).json()).items}},
  async apply({upserts,removes}){await Promise.all([...upserts.map(it=>call(`${base}/items/${it.id}`,{method:'PUT',body:JSON.stringify(it)})),...removes.map(id=>call(`${base}/items/${id}`,{method:'DELETE'}))])}}};
const Repo=LocalAdapter;/* เมื่อมี backend: const Repo=HttpAdapter('/api'); */
function diffItems(prev,next){const m=new Map(prev.map(x=>[x.id,JSON.stringify(x)])),ids=new Set(next.map(x=>x.id));return {upserts:next.filter(x=>m.get(x.id)!==JSON.stringify(x)),removes:prev.filter(x=>!ids.has(x.id)).map(x=>x.id)}}
async function syncChanges(prev,next){const ch=diffItems(prev,next);if(!ch.upserts.length&&!ch.removes.length)return;await Repo.apply(ch,{items:next})}
/* ===== MODULE: data/auth — จุดต่อระบบบัญชี: เปลี่ยน `Auth` ตัวเดียว (UI ไม่รู้ว่าล็อกอินทำงานอย่างไร) =====
   สัญญา adapter: session():User|null · signInGoogle() · signInEmail(email,pw) · signUp({name,email,password}) · sendReset(email) · signOut() · deleteAccount()
   error ต้องโยก code: invalid_credentials | email_taken | network | unknown — ของจริง: เก็บ session เป็น httpOnly cookie, แฮชรหัสผ่านฝั่ง Server (Argon2/bcrypt) */
const USERS_KEY='evarel-demo-users',SESSION_KEY='evarel-demo-session',AUTH_DELAY_MS=700;
const authErr=code=>Object.assign(new Error(code),{code});
const readUsers=()=>{try{return JSON.parse(localStorage.getItem(USERS_KEY))||[]}catch(err){console.warn('users',err);return []}};
const writeUsers=u=>localStorage.setItem(USERS_KEY,JSON.stringify(u));
const pubUser=u=>({id:u.id,name:u.name,email:u.email,provider:u.provider});
async function hashPw(p){try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('evarel-demo:'+p));return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(err){console.warn('subtle unavailable',err);let h=5381;for(const ch of p)h=(h*33)^ch.charCodeAt(0);return 'weak'+(h>>>0)}}
const DEMO_GOOGLE={name:'Nontakorn',email:'demo.user@gmail.com'};
const newId=()=>'u_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MockAuth={
 async session(){const id=localStorage.getItem(SESSION_KEY),u=id&&readUsers().find(x=>x.id===id);return u?pubUser(u):null},
 async signInGoogle(){await wait(AUTH_DELAY_MS);const us=readUsers();let u=us.find(x=>x.email===DEMO_GOOGLE.email);if(!u){u={id:newId(),...DEMO_GOOGLE,provider:'google'};us.push(u);writeUsers(us)}localStorage.setItem(SESSION_KEY,u.id);return pubUser(u)},
 async signInEmail(email,pw){await wait(AUTH_DELAY_MS);const e=email.trim().toLowerCase(),u=readUsers().find(x=>x.email===e&&x.provider==='email');if(!u||u.hash!==await hashPw(pw))throw authErr('invalid_credentials');localStorage.setItem(SESSION_KEY,u.id);return pubUser(u)},
 async signUp({name,email,password}){await wait(AUTH_DELAY_MS);const e=email.trim().toLowerCase(),us=readUsers();if(us.some(x=>x.email===e))throw authErr('email_taken');const u={id:newId(),name,email:e,provider:'email',hash:await hashPw(password)};us.push(u);writeUsers(us);localStorage.setItem(SESSION_KEY,u.id);return pubUser(u)},
 async sendReset(email){await wait(AUTH_DELAY_MS)},
 async signOut(){localStorage.removeItem(SESSION_KEY)},
 async deleteAccount(){const id=localStorage.getItem(SESSION_KEY);writeUsers(readUsers().filter(x=>x.id!==id));[STORE_KEY,CHATS_KEY,TIMER_KEY].forEach(k=>localStorage.removeItem(`${k}:${id}`));localStorage.removeItem(SESSION_KEY)}};
const HttpAuth=base=>{const call=(p,o={})=>fetch(`${base}${p}`,{credentials:'include',headers:{'Content-Type':'application/json'},...o}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw authErr(j.code||'unknown');return j}).catch(err=>{throw err.code?err:authErr('network')});
 const post=(p,b)=>call(p,{method:'POST',body:b?JSON.stringify(b):undefined});
 return {session:()=>fetch(`${base}/auth/me`,{credentials:'include'}).then(r=>r.ok?r.json():null),signInGoogle:idToken=>post('/auth/google',{idToken}),signInEmail:(email,password)=>post('/auth/login',{email,password}),signUp:b=>post('/auth/signup',b),sendReset:email=>post('/auth/forgot',{email}),signOut:()=>post('/auth/logout'),deleteAccount:()=>call('/auth/me',{method:'DELETE'})}};
const Auth=MockAuth;/* backend จริง: const Auth=HttpAuth('/api'); แล้วให้ปุ่ม Google เรียก Google Identity Services เพื่อได้ idToken ส่งให้ Server ตรวจสอบ */
const initial=()=>((USER?.name||USER?.email||'?').trim()[0]||'?').toUpperCase();

const S={items:[]};
const UI={tab:'today',date:TODAY,auth:{status:'loading',screen:'welcome',email:'',cool:0},type:'all',period:'week',cal:null,lastW:{},calView:'dayGridMonth',calSel:TODAY,calDate:null,weekOff:0,weekDir:0,fdate:TODAY,error:null,loading:true,animate:true,pop:null,lastP:0};
const find=id=>S.items.find(x=>x.id==id);

/* ===== MODULE: services/schedule ===== */
function occursOn(it,ds){const d0=parse(it.start),d=parse(ds),r=it.repeat;if(d<d0||(it.end&&d>parse(it.end)))return false;
 if(r.unit==='none')return ds===it.start;
 if(r.unit==='day')return Math.round((d-d0)/DAY_MS)%r.every===0;
 if(r.unit==='week')return r.days.includes(d.getDay())&&Math.floor(Math.round((d-addDays(d0,-d0.getDay()))/DAY_MS)/7)%r.every===0;
 return d.getDate()===d0.getDate()&&((d.getFullYear()-d0.getFullYear())*12+d.getMonth()-d0.getMonth())%r.every===0}
const val=(it,ds)=>it.log[ds]||0,target=it=>it.track==='count'||it.track==='timer'?it.target:1,tracked=it=>it.track!=='none';
const isDone=(it,ds)=>val(it,ds)>=target(it),skipped=(it,ds)=>!!it.skip[ds],isFuture=ds=>ds>TODAY;
const onDate=ds=>S.items.filter(it=>occursOn(it,ds)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const overdue=()=>S.items.filter(it=>it.type==='task'&&it.start<TODAY&&!isDone(it,it.start)).sort((a,b)=>a.start.localeCompare(b.start));
function streak(it){let n=0;for(let i=0;i<STREAK_LOOKBACK;i++){const ds=ymd(addDays(new Date(),-i));if(!occursOn(it,ds)||skipped(it,ds))continue;if(isDone(it,ds))n++;else if(i>0)break}return n}
function rate(it){let t=0,ok=0;for(let i=0;i<STAT_DAYS;i++){const ds=ymd(addDays(new Date(),-i));if(ds<it.start||!occursOn(it,ds)||skipped(it,ds))continue;t++;if(isDone(it,ds))ok++}return t?Math.round(100*ok/t):0}

  S.items.forEach(it=>{if(!scheduled(it,ds)||skipped(it,ds)||(it.type==='habit'&&!it.time))return;const done=tracked(it)&&isDone(it,ds),ev={id:`${it.id}_${ds}`,title:it.title,classNames:[`ev-fc-${it.type}`,...(done?['is-done']:[])],extendedProps:{itemId:it.id}};

const AUTH_VIEWS={
 welcome:()=>`<div class="ev-hero">${RINGS}<div class="ev-brand">${EV_MARK}<b>Evarel</b><span class="ev-tag">จัดการกิจวัตรและชีวิตให้ง่ายขึ้น</span></div></div>
  <div class="ev-auth-body"><div><h1 class="ev-auth-title">เริ่มต้นใช้งาน</h1><p class="ev-sub" style="margin-top:6px">ติ๊ก นับ จับเวลา และดูความต่อเนื่องของนิสัย ทั้งหมดในที่เดียว</p></div>
  <div class="ev-stack">${gBtn('ดำเนินการต่อด้วย Google')}<button class="ev-btn-auth" data-kind="ink" data-act="au-go" data-id="signup">${icon('mail')}<span>สร้างบัญชีด้วยอีเมล</span></button></div>
  <p class="ev-auth-sw">มีบัญชีอยู่แล้ว? <button data-act="au-go" data-id="login">เข้าสู่ระบบ</button></p></div>${legal}`,
 login:()=>`${authBack('welcome')}<div><h1 class="ev-auth-title">เข้าสู่ระบบ</h1><p class="ev-sub" style="margin-top:6px">ยินดีต้อนรับกลับมา</p></div>${gBtn('เข้าสู่ระบบด้วย Google')}<div class="ev-or">หรือใช้อีเมล</div>
  <form class="ev-form ev-authform" data-kind="login" novalidate><div class="ev-banner" id="form-err" role="alert" hidden></div>${fld('อีเมล','email','email',EMAIL_X)}${fld('รหัสผ่าน','password','password','autocomplete="current-password" placeholder="รหัสผ่าน"',eyeBtn('f-password'))}
  <button type="button" class="ev-link" style="justify-self:end;padding:0" data-act="au-go" data-id="forgot">ลืมรหัสผ่าน?</button>${submitBtn('เข้าสู่ระบบ')}</form><p class="ev-auth-sw">ยังไม่มีบัญชี? <button data-act="au-go" data-id="signup">สร้างบัญชี</button></p>${legal}`,
 signup:()=>`${authBack('welcome')}<div><h1 class="ev-auth-title">สร้างบัญชี</h1><p class="ev-sub" style="margin-top:6px">ใช้เวลาไม่ถึงหนึ่งนาที</p></div>${gBtn('สมัครด้วย Google')}<div class="ev-or">หรือใช้อีเมล</div>
  <form class="ev-form ev-authform" data-kind="signup" novalidate><div class="ev-banner" id="form-err" role="alert" hidden></div>${fld('ชื่อที่ใช้แสดง','name','text','autocomplete="name" maxlength="40" placeholder="ชื่อของคุณ"')}${fld('อีเมล','email','email',EMAIL_X)}
  <div class="ev-ifield">${fld('รหัสผ่าน','password','password',`autocomplete="new-password" placeholder="อย่างน้อย ${PW_MIN} ตัวอักษร"`,eyeBtn('f-password'))}<div class="ev-meter" id="pwMeter" data-lv="0"><i></i><i></i><i></i><i></i></div><span class="ev-sub" id="pwLabel">ใช้ตัวพิมพ์เล็ก-ใหญ่ ตัวเลข และสัญลักษณ์ผสมกันจะปลอดภัยขึ้น</span></div>
  <div class="ev-ifield"><label class="ev-check-row"><input type="checkbox" class="ev-cb" name="terms"><span>ฉันยอมรับ <button type="button" data-act="au-terms" data-id="terms">ข้อกำหนด</button> และ <button type="button" data-act="au-terms" data-id="privacy">นโยบายความเป็นส่วนตัว</button></span></label><div class="ev-field-err" id="e-terms" hidden></div></div>${submitBtn('สร้างบัญชี')}</form><p class="ev-auth-sw">มีบัญชีอยู่แล้ว? <button data-act="au-go" data-id="login">เข้าสู่ระบบ</button></p>`,
 forgot:()=>`${authBack('login')}<div><h1 class="ev-auth-title">ลืมรหัสผ่าน</h1><p class="ev-sub" style="margin-top:6px">ใส่อีเมลที่ใช้สมัคร เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้</p></div>
  <form class="ev-form ev-authform" data-kind="forgot" novalidate><div class="ev-banner" id="form-err" role="alert" hidden></div>${fld('อีเมล','email','email',EMAIL_X)}${submitBtn('ส่งลิงก์รีเซ็ต')}</form>`,
 sent:()=>`${authBack('login')}<div class="ev-sent"><div class="orb">${icon('mail')}</div><h1 class="ev-auth-title" style="font-size:24px">ตรวจสอบอีเมลของคุณ</h1><p class="ev-sub" style="max-width:300px">ถ้ามีบัญชีที่ใช้ <b>${esc(UI.auth.email)}</b> เราได้ส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้แล้ว</p></div>
  <button class="ev-btn-auth" data-kind="accent" data-act="au-go" data-id="login">กลับไปเข้าสู่ระบบ</button><button class="ev-btn-auth" data-kind="google" id="resendBtn" data-act="au-resend" disabled></button>`};
const AUTH_SPLASH=`<div class="ev-splash">${EV_MARK}<b style="font-size:28px;letter-spacing:-1px">Evarel</b></div>`;
function renderAuthRoot(){const au=$('auth');au.hidden=false;const sc=UI.auth.status==='loading'?'loading':UI.auth.screen;if(au.dataset.screen===sc)return;au.dataset.screen=sc;
 au.innerHTML=`<div class="ev-auth-in">${sc==='loading'?AUTH_SPLASH:AUTH_VIEWS[sc]()}</div>`;au.scrollTop=0;[...au.firstElementChild.children].forEach((el,i)=>el.style.setProperty('--i',i));
 if(sc==='sent')startCool();if(['login','signup','forgot'].includes(sc))setTimeout(()=>au.querySelector('input')?.focus({preventScroll:true}),400)}
let coolT=null;
function paintCool(){const b=$('resendBtn');if(!b)return;const n=UI.auth.cool;b.disabled=n>0;b.innerHTML=n>0?`<span>ส่งอีกครั้งได้ใน ${n} วินาที</span>`:'<span>ส่งลิงก์อีกครั้ง</span>'}
function startCool(){stopCool();UI.auth.cool=RESEND_SEC;paintCool();coolT=setInterval(()=>{UI.auth.cool=Math.max(0,UI.auth.cool-1);paintCool();if(!UI.auth.cool)stopCool()},1000)}
function stopCool(){clearInterval(coolT);coolT=null}
async function resendReset(){if(UI.auth.cool>0)return;const b=$('resendBtn');b.disabled=true;b.innerHTML='<span class="ev-spin"></span>';try{await Auth.sendReset(UI.auth.email);toast('ส่งลิงก์อีกครั้งแล้ว')}catch(err){toast(AU_MSG[err.code]||AU_MSG.unknown)}startCool()}
const fieldErr=(form,name,msg)=>{const inp=form.querySelector(`[name="${name}"]`),box=form.querySelector(`#e-${name}`);if(inp&&inp.type!=='checkbox')inp.setAttribute('aria-invalid',String(!!msg));if(box){box.hidden=!msg;box.removeAttribute('data-tone');box.innerHTML=msg?`${icon('alert')}<span>${esc(msg)}</span>`:''}};
function clearErrs(form){form.querySelectorAll('.ev-input').forEach(i=>i.setAttribute('aria-invalid','false'));form.querySelectorAll('.ev-field-err').forEach(b=>{b.hidden=true;b.innerHTML=''});const fe=form.querySelector('#form-err');if(fe){fe.hidden=true;fe.textContent=''}}
function setBusy(form,on){const b=form.querySelector('button[type="submit"]');b.disabled=on;b.innerHTML=on?'<span class="ev-spin"></span>':`<span>${b.dataset.label}</span>`;form.querySelectorAll('input').forEach(i=>{i.readOnly=on})}
function authValidate(kind,v){const e={},em=(v.email||'').trim();if(!em)e.email='กรุณากรอกอีเมล';else if(!EMAIL_RE.test(em))e.email='รูปแบบอีเมลไม่ถูกต้อง (เช่น name@gmail.com)';
 if(kind==='signup'){if(!(v.name||'').trim())e.name='กรุณากรอกชื่อ';if((v.password||'').length<PW_MIN)e.password=`รหัสผ่านอย่างน้อย ${PW_MIN} ตัวอักษร`;if(!v.terms)e.terms='ต้องยอมรับข้อกำหนดก่อนสร้างบัญชี'}
 if(kind==='login'&&!v.password)e.password='กรุณากรอกรหัสผ่าน';return e}
async function authSubmit(kind,form){clearErrs(form);const v=Object.fromEntries(new FormData(form)),errs=authValidate(kind,v),keys=Object.keys(errs);
 if(keys.length){keys.forEach(k=>fieldErr(form,k,errs[k]));form.querySelector(`[name="${keys[0]}"]`)?.focus();haptic();return}
 setBusy(form,true);
 try{if(kind==='forgot'){await Auth.sendReset(v.email.trim());UI.auth.email=v.email.trim();UI.auth.screen='sent';renderAuthRoot();return}
  const user=kind==='login'?await Auth.signInEmail(v.email.trim(),v.password):await Auth.signUp({name:v.name.trim(),email:v.email.trim(),password:v.password});await enterApp(user)}
 catch(err){setBusy(form,false);if(err.code==='email_taken')fieldErr(form,'email',AU_MSG.email_taken);else{const fe=form.querySelector('#form-err');fe.textContent=AU_MSG[err.code]||AU_MSG.unknown;fe.hidden=false;fe.style.animation='none';void fe.offsetWidth;fe.style.animation=''}haptic()}}
async function authGoogle(btn){const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="ev-spin"></span>';try{await enterApp(await Auth.signInGoogle())}catch(err){btn.disabled=false;btn.innerHTML=old;toast(AU_MSG[err.code]||AU_MSG.unknown)}}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='f-password'&&t.closest('[data-kind="signup"]')){const p=t.value,s=[p.length>=PW_MIN,p.length>=12,/[a-z]/.test(p)&&/[A-Z]/.test(p),/\d/.test(p),/[^\w]/.test(p)].filter(Boolean).length,lv=p.length<PW_MIN?(p?1:0):Math.min(4,Math.max(1,s-1));
 $('pwMeter').dataset.lv=lv;$('pwLabel').textContent=p?(p.length<PW_MIN?`อีก ${PW_MIN-p.length} ตัวอักษรจึงจะใช้ได้`:['','อ่อน','พอใช้','ดี','แข็งแรง'][lv]):'ใช้ตัวพิมพ์เล็ก-ใหญ่ ตัวเลข และสัญลักษณ์ผสมกันจะปลอดภัยขึ้น'}
 if(t.closest('.ev-authform')&&t.getAttribute('aria-invalid')==='true'){t.setAttribute('aria-invalid','false');const b=$('e-'+t.name);if(b){b.hidden=true;b.innerHTML=''}}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.name!=='email'||!t.closest?.('.ev-authform'))return;const [u,dom]=t.value.trim().split('@'),fix=dom&&MAIL_TYPO[dom.toLowerCase()],b=$('e-email');
 if(fix&&b){b.hidden=false;b.dataset.tone='hint';b.innerHTML=`<span>หมายถึง ${esc(u)}@${fix} หรือเปล่า?</span><button type="button" data-act="au-fixmail" data-id="${esc(u)}@${fix}">ใช้อันนี้</button>`}});
async function enterApp(user){USER=user;await loadApp()}
async function doSignOut(del){try{if(del)await Auth.deleteAccount();else await Auth.signOut()}catch(err){console.warn('signout',err);toast(AU_MSG.unknown);return}
 while(LAYERS.length)popLayer();closePop();destroyCal('main');destroyCal('habit');DETAIL=null;S.items=[];CH={list:[],cur:null};TM=null;USER=null;
 Object.assign(UI,{tab:'today',date:TODAY,type:'all',weekOff:0,loading:true,error:null});UI.auth={status:'out',screen:'welcome',email:'',cool:0};$('auth').dataset.screen='';render();if(del)toast('ลบบัญชีแล้ว')}

let swipeX=null;
document.addEventListener('touchstart',e=>{swipeX=e.target.closest('.ev-week')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(swipeX==null)return;const dx=e.changedTouches[0].clientX-swipeX;swipeX=null;if(Math.abs(dx)>50){UI.weekOff+=dx<0?1:-1;UI.weekDir=dx<0?1:-1;render()}},{passive:true});
const errorView=()=>`<div class="ev-error">${empty('x','โหลดข้อมูลไม่สำเร็จ','ตรวจสอบการเชื่อมต่อแล้วลองใหม่')}<button class="ev-btn-primary" data-act="retry">ลองใหม่</button></div>`;

/* ===== MODULE: render ===== */
function countUp(el){const to=+el.dataset.count,t0=performance.now(),dur=700;const f=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function setBar(el,v){const k=el.dataset.kind;if(k==='arc')el.style.strokeDashoffset=ARC_C*(1-v/100);else if(k==='col')el.style.transform=`scaleY(${v/100})`;else if(el.closest('.ev-prog'))el.style.setProperty('--w',v);else el.style.width=v+'%'}
function growBars(root,anim){root.querySelectorAll('[data-to]').forEach(el=>{const to=Math.max(0,Math.min(100,+el.dataset.to||0)),k=el.dataset.k||'';setBar(el,anim?0:(UI.lastW[k]??0));UI.lastW[k]=to;requestAnimationFrame(()=>requestAnimationFrame(()=>setBar(el,to)))})}
function render(){document.body.dataset.auth=UI.auth.status==='in'?'in':'out';if(UI.auth.status!=='in'){renderAuthRoot();return}$('auth').hidden=true;$('auth').dataset.screen='';
 const root=$('app'),anim=UI.animate&&!UI.loading;root.innerHTML=UI.loading?skeleton():UI.error?errorView():VIEWS[UI.tab]();
 root.classList.toggle('ev-enter',anim);[...root.children].forEach((c,i)=>c.style.setProperty('--i',i));
 root.querySelectorAll('[data-count]').forEach(el=>anim?countUp(el):(el.textContent=el.dataset.count));
 growBars(root,anim);UI.weekDir=0;if(UI.tab==='calendar'&&!UI.loading&&!UI.error)mountMain();else destroyCal('main');
 UI.animate=false;
 const tabs=TABS.map(([id,l,ic])=>`<li><button data-tab="${id}" ${UI.tab===id?'aria-current="page"':''}><span class="pill">${icon(ic)}</span>${l}</button></li>`);
 tabs.splice(2,0,`<li><button class="add" data-act="add" aria-label="เพิ่มรายการ">${icon('plus')}</button></li>`);
 $('nav').innerHTML=tabs.join('');updateLive();refreshDetail()}
async function loadApp(){UI.auth.status='in';CH=loadChats();TM=loadTM();UI.loading=true;UI.error=null;render();
 try{const [s]=await Promise.all([Repo.load(),wait(SKELETON_MS)]);S.items=s.items}catch(err){console.warn('load failed',err);UI.error=err}
 UI.loading=false;UI.animate=true;render()}
async function boot(){UI.auth.status='loading';render();try{USER=await Auth.session()}catch(err){console.warn('session failed',err);USER=null}
 if(!USER){UI.auth.status='out';UI.auth.screen='welcome';render();return}await loadApp()}
boot();
</script>
</body>
</html>
