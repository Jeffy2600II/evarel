# Evarel Web (ส่วนหน้า PWA เสิร์ฟเป็น Static Assets)
#   forge      = ชุดพัฒนา -> ordivel-app-forge
#   production = ชุดทางการ -> ordivel-app
# ที่อยู่ API ฉีดตอน deploy ด้วย scripts/deploy.mjs ไม่ฝังในไฟล์ต้นฉบับ
# account_id ตั้งผ่านตัวแปรสภาพแวดล้อม CLOUDFLARE_ACCOUNT_ID

compatibility_date = "2026-10-01"
[assets]
directory = "../../build/web"

[env.forge]
name = "ordivel-app-forge"

[env.production]
name = "ordivel-app"
