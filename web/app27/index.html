<!-- v26: ยกเครื่องดีไซน์ทั้งแอป อ้างอิงตัวอย่างจริงจากแอป/ฐานข้อมูลรวมสกรีน (Mobbin·screensdesign) ตามไฟล์ design-protocol ที่แนบมา:
  1) ฟอร์มสร้างกิจวัตร (bottom sheet): เพิ่มแถว "เริ่มวันที่" เป็นช่องหลักที่เห็นชัด ไม่ต้องเปิดพับ "ช่วงเวลา" + ชิปด่วน วันนี้/พรุ่งนี้/+7 วัน
     — หลักฐาน: Habitify iOS "New Habit screen with text field and options for repeat, start date, and reminders" (Mobbin) · TickTick Developer API habit มี targetStartDate (YYYYMMDD) · ฟอร์มแบบเดิมซ่อนวันเริ่มในพับซึ่งขัด NN/g bottom sheet (context ควรเห็นทันที)
  2) หน้าวันนี้: แยก section ชัด 4 ท่อน — สรุปวงแหวน / "กิจวัตรวันนี้" เป็นตัวไทล์ติ๊กวงใหญ่ 64px + วงแหวนความคืบหน้า + เปลวไฟ streak (Streaks: Apple Design Award 2016, big-button check-in) / การ์ด "ค้างอยู่" มีปุ่มเลื่อนเป็นวันนี้ทั้งชุดและรายงาน (TickTick Updates 2025: bulk Postpone) / ตารางวันนี้แยกการ์ดตามช่วงเวลา
  3) ยกเครื่องโทเคน: โค้งมนเพิ่มทั้งระบบ (scale 12/16/22/28/34 + sheet 38) เงานุ่ม 2 ชั้น พื้นหลังอุ่นขึ้น การ์ดสรุปวงแหวนแทนแถบ
  4) bottom sheet คุมตาม NN/g (จับหัวลากได้ ปิดได้หลายทาง ไม่ปิดพลาด) + M3 (drag handle · ระดับความสูง) — ของเดิม v25 มีอยู่แล้ว คงไว้ครบ
  5) เป็นมิตร: ฉลองเมื่อทำครบวัน (celebrate) · streak เปลวไฟในสถิติ/รายละเอียด · ชิป "เริ่มวันที่" ในรายละเอียด · ปุ่มเลื่อนรายงาน
  ของเดิม v25: ใช้ฟอนต์ของเครื่อง (ตรงกับระบบจริง 2026.2.9) ไม่โหลดฟอนต์ภายนอก -->
<!-- Ordivel Master Demo v27 (ต่อจาก v26: ฟอร์มแยกการ์ด · แจ้งเตือนสองแบบ · สถิติรายวัน) · v25 (ต่อจาก Evarel v24): ยี่ห้อใหม่ Ordivel (ชื่อ/โลโก้ใช้ตามระบบจริง 2026.2.66) · สีหลักเปลี่ยนม่วง→indigo #4F46E5 ทั้งสว่าง/มืด ตัวอักษรบนปุ่มหลักโหมดมืดเป็นหมึกเข้ม (2026.2.63) · ฟอนต์ของเครื่อง ไม่โหลดฟอนต์ภายนอก (2026.2.9) · ตรวจรูปแบบอีเมลสดทุกการแก้ไข + ยกเลิกการเดาอีเมลพิมพ์ผิด (2026.7.0/8.0/8.1) · กด Google ขึ้นสแปลช "กำลังเข้าสู่ระบบด้วย Google…" (2026.2.65) · ข้อความ AI เรนเดอร์ Markdown (หนา/เอียง/ลิสต์/โค้ด/ตาราง ตามระบบจริง) · หน้าตั้งค่าเพิ่มการ์ด "เกี่ยวกับ" (2026.1.0) · หน้าเต็มมีชื่อสำหรับโปรแกรมอ่านหน้าจอ (2026.2.6) · การเก็บข้อมูล/คีย์/seed ทุกอย่างเหมือน v24 เดิม · · ของเดิม v24 (ต่อจาก v23): แถบปุ่มล่าง bottom sheet ไม่เลื่อนขึ้นซ้ำ · แก้วงกลมวันที่ซ้อนกันในปฏิทิน · v23 (ต่อจาก v22): ครอบคลุมอนิเมชั่นเล่นซ้ำ: ปิดอนิเมชั่นเข้าหลังเล่นจบทั้งแอป · เคลียร์อนิเมชั่นติ๊ก (pop) · v22 (ต่อจาก v21): แก้อนิเมชั่นเล่นซ้ำ (ไอคอน/ลูกศร/องค์ประกอบเล็กไม่เล่นเข้าใหม่, ปิดอนิเมชั่นเข้าหน้าหลังเล่นจบ) · เปลี่ยนฟอนต์เป็น Anuphan · v21 (ต่อจาก v20): เติมสถานะว่างของเวลาในช่องเตือน/หน้ารายละเอียด/ครั้งถัดไป · v20 (ต่อจาก v19): ช่องเวลาแสดงสถานะ "ยังไม่ได้ตั้งเวลา" + ปุ่มเพิ่ม/ล้าง · ปฏิทินโปร่งแบบ native · หน้า Today/สถิติ นิ่งและมีพื้นที่มากขึ้น · v19 (ต่อจาก v18): ปรับความสูง bottom sheet แบบมี transition · อวาตาร์โปรไฟล์เป็นระบบกลาง · v18 (ต่อจาก v17): bottom sheet ไม่เปิดคีย์บอร์ดอัตโนมัติ · v17: แก้ปุ่มแนะนำ/การส่งข้อความหน้า AI · ปรับขนาดตัวอักษร · เพิ่ม contrast -->

/* Path: design/master-demo-v3.html | Purpose: เดโมต้นแบบ UX ระดับแอป (ไฟล์เดียว) — โทเคนตรงกับ app/styles/tokens.css

/* ============ TOKENS ============ */
:root{
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Thai','Noto Sans Thai UI',sans-serif;
  --c-bg:#F7F7F9;--c-surface:#fff;--c-text:#14141A;--c-muted:#6A6A77;--c-line:#E8E8ED;--c-fill:#EDEDF1;--c-on-ink-soft:rgba(255,255,255,.2);

  --c-ok:#18A66A;--c-on-ok:#fff;--c-warn:#E8890C;--c-danger:#E5484D;--c-danger-soft:#FDECEC;--c-warn-soft:#FFF3E0;--c-scrim:rgba(10,10,20,.45);
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;
  --r-card:26px;--r-pill:999px;--r-sheet:32px;
  --shadow:0 0 0 1px rgba(20,20,26,.035);--dock:calc(var(--nav-h) + env(safe-area-inset-bottom,0) + 10px);--shadow-fab:0 6px 20px rgba(79,70,229,.35);
  --t-fast:.18s;--t-med:.32s;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);

}

/* ============ BASE / LAYOUT ============ */
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);-webkit-tap-highlight-color:transparent;line-height:1.45;font-size:15px}
button,input,select{font-family:inherit;color:inherit}
button{padding:0}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
body[data-lock="true"]{position:fixed;left:0;right:0;width:100%;overflow:hidden}
[inert]{pointer-events:none}
[hidden]{display:none!important}
.ev-app{max-width:var(--col-max);margin:0 auto;min-height:100vh;padding:0 0 calc(var(--dock) + 76px)}
.ev-header{display:flex;align-items:center;justify-content:space-between;padding:var(--s2) var(--s2) 4px}
.ev-title{font-size:28px;font-weight:700;letter-spacing:-.4px;padding:0 var(--s2) 12px;line-height:1.25}
.ev-sub{color:var(--c-muted);font-size:14px}
.ev-main{padding:0 var(--s2);display:grid;gap:var(--s2)}
.ev-section-title{font-size:18px;font-weight:600;margin-top:var(--s1)}
.ev-group{font-size:12px;font-weight:600;color:var(--c-muted);letter-spacing:.04em;padding:12px 0 2px}
.ev-icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ev-row{display:flex;align-items:center;gap:var(--s2)}.ev-row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.grow{flex:1;min-width:0}
ul{list-style:none;padding:0}

/* ============ COMPONENTS ============ */
.ev-card{background:var(--c-surface);border-radius:var(--r-card);padding:var(--s2);box-shadow:var(--shadow)}
.ev-card[data-tone="ink"]{background:var(--c-text);color:var(--c-bg);box-shadow:none}.ev-card[data-tone="ink"] .ev-chip{background:var(--c-on-ink-soft);color:var(--c-bg)}
.ev-card[data-tone="warn"]{background:var(--c-warn-soft);box-shadow:none}
.ev-icon-btn{width:40px;height:40px;border-radius:var(--r-pill);border:0;background:var(--c-surface);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform var(--t-fast) var(--ease)}
.ev-icon-btn[data-tone="accent"]{background:var(--c-accent-soft);color:var(--c-accent-text)}
.ev-icon-btn[data-flat]{box-shadow:none;background:none;width:40px;height:40px;color:var(--c-muted)}
.ev-avatar{width:40px;height:40px;border-radius:var(--r-pill);border:0;background:var(--c-accent);color:var(--c-on-accent);font-weight:700;font-size:15px}
.ev-btn-primary,.ev-btn-ghost,.ev-btn-danger{height:48px;padding:0 22px;border-radius:var(--r-pill);font:600 15px var(--font);border:0;transition:transform var(--t-fast) var(--ease),opacity var(--t-fast)}
.ev-btn-primary{background:var(--c-accent);color:var(--c-on-accent)}
.ev-btn-ghost{background:var(--c-fill);color:var(--c-text)}
.ev-btn-danger{background:var(--c-danger-soft);color:var(--c-danger)}
.ev-btn-block{width:100%}.ev-btn-sm{height:36px;padding:0 var(--s2);font-size:14px}
:is(.ev-btn-primary,.ev-btn-ghost,.ev-btn-danger,.ev-icon-btn,.ev-mini,.ev-step button):active{transform:scale(.94)}
.ev-btn-primary:disabled{opacity:.45}
.ev-list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--c-line);position:relative}
.ev-list-item:last-child{border-bottom:0}
.ev-list-item b{display:block;font-weight:500;transition:color var(--t-med)}
.ev-list-item[data-state="done"] b{color:var(--c-muted);text-decoration:line-through;text-decoration-color:var(--c-muted)}
.ev-list-item[data-next="true"]::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--c-accent)}
.ev-check{width:26px;height:26px;padding:0;border-radius:var(--r-pill);border:1.5px solid var(--c-line);background:none;color:transparent;display:grid;place-items:center;flex:none;transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.ev-check svg{display:block;width:14px;height:14px;stroke-width:3.2;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s}
.ev-check[aria-checked="true"]{background:var(--c-ok);border-color:var(--c-ok);color:var(--c-on-ok)}
.ev-check[aria-checked="true"] svg{stroke-dashoffset:0}
.ev-check[data-pop="true"]{animation:pop .45s var(--spring)}
.ev-check:disabled{opacity:.4}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.ev-chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:var(--r-pill);background:var(--c-fill);color:var(--c-muted);white-space:nowrap}
.ev-chip[data-state="late"]{background:var(--c-danger-soft);color:var(--c-danger)}.ev-chip[data-state="soon"]{background:var(--c-warn-soft);color:var(--c-warn)}.ev-chip[data-state="ok"]{background:var(--c-bg);color:var(--c-muted)}
.ev-filters{display:flex;gap:var(--s1);overflow-x:auto;padding:0 var(--s2) var(--s2);scrollbar-width:none}.ev-filters::-webkit-scrollbar{display:none}
.ev-filters button{height:36px;padding:0 16px;border-radius:var(--r-pill);border:0;background:var(--c-surface);font:500 14px var(--font);white-space:nowrap;transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast)}
.ev-filters button[aria-pressed="true"]{background:var(--c-text);color:var(--c-bg)}
.ev-filters button:active{transform:scale(.95)}
.ev-wrap{padding:0;flex-wrap:wrap;overflow:visible}
.ev-empty{text-align:center;padding:var(--s4) var(--s2);color:var(--c-muted);display:grid;gap:var(--s1);justify-items:center}

.ev-empty .orb{width:72px;height:72px;border-radius:50%;background:var(--c-fill);color:var(--c-muted);display:grid;place-items:center;margin-bottom:8px}.ev-empty .orb svg{width:28px;height:28px}
.ev-skeleton{height:96px;border-radius:var(--r-card);background:linear-gradient(90deg,var(--c-line),var(--c-surface),var(--c-line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.ev-bar{height:6px;border-radius:6px;background:var(--c-line);margin-top:6px;overflow:hidden}.ev-bar i{display:block;width:0;height:100%;background:var(--c-accent);border-radius:6px;transition:width .5s var(--ease)}
.ev-bar i[data-full="true"]{background:var(--c-ok)}
.ev-step{display:flex;gap:6px}
.ev-step button,.ev-mini{height:34px;min-width:34px;border-radius:var(--r-pill);border:0;background:var(--c-fill);color:var(--c-text);font:700 17px var(--font);padding:0 12px;display:grid;place-items:center;transition:transform var(--t-fast) var(--ease)}
.ev-mini[data-tone="solid"]{background:var(--c-accent);color:var(--c-on-accent)}
.ev-step button:disabled{opacity:.35}
.ev-week{display:flex;gap:6px;padding:0 var(--s2) var(--s2)}
.ev-week button{flex:1;border:0;border-radius:22px;padding:7px 0;background:var(--c-surface);font:500 12px var(--font);display:grid;gap:2px;transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease)}
.ev-week b{font-size:16px}.ev-week button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent);transform:translateY(-2px)}
.ev-week button[data-today="true"]:not([aria-pressed="true"]) b{color:var(--c-accent-text)}
.ev-stat{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}.ev-streak{font-size:26px;font-weight:700;color:var(--c-accent-text);text-align:right;line-height:1}
.ev-bars{display:flex;gap:6px;align-items:flex-end;height:56px;margin-top:14px}
.ev-bars i{flex:1;border-radius:6px;background:var(--c-line);min-height:6px;transform-origin:bottom}
.ev-bars i[data-state="hit"]{background:var(--c-accent)}.ev-bars i[data-state="off"]{background:var(--c-bg)}
.ev-seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--c-fill);padding:4px;border-radius:var(--r-pill)}
.ev-seg button{height:36px;border:0;border-radius:var(--r-pill);background:none;color:var(--c-muted);font:600 14px var(--font);transition:background var(--t-fast),color var(--t-fast)}
.ev-seg button[aria-pressed="true"]{background:var(--c-surface);color:var(--c-text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ev-form{display:grid;gap:var(--s2)}.ev-field{display:grid;gap:6px}.ev-field>span{font-size:13px;color:var(--c-muted);font-weight:500}
.ev-input{width:100%;height:46px;border-radius:18px;border:1.5px solid var(--c-line);background:var(--c-surface);padding:0 var(--s2);font:400 16px var(--font);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.ev-input:focus{outline:0;border-color:var(--c-accent);box-shadow:0 0 0 4px var(--c-accent-soft)}
.ev-form-err{background:var(--c-danger-soft);color:var(--c-danger);padding:12px var(--s2);border-radius:16px;font-size:14px;font-weight:500;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== Tailwind components (@apply) — คอมโพเนนต์ชั้นซ้อน/เกสเจอร์ย้ายมาเป็น Tailwind แล้ว · ส่วนอื่นยังเป็น CSS เดิม รอย้ายทีละส่วน ===== */
@layer components{
 .ev-scrim{@apply fixed inset-0 z-[23] pointer-events-none bg-[var(--c-scrim)] opacity-0 transition-opacity duration-300 ease-out-expo data-[open=true]:pointer-events-auto data-[open=true]:opacity-100}
 .ev-sheet{@apply fixed inset-x-0 bottom-[var(--kb,0px)] z-[24] mx-auto flex max-h-[90dvh] max-w-col translate-y-[105%] flex-col rounded-t-sheet bg-surface shadow-[0_-8px_40px_rgba(0,0,0,.18)] will-change-transform transition-transform duration-[420ms] ease-out-expo data-[open=true]:translate-y-0 data-[drag=true]:transition-none}
 /* .ev-page: v15 — ย้ายไปเป็น CSS ธรรมดาด้านล่าง (โมชันแบบ fade-through + scale ใช้เฉพาะ transform/opacity) */
 .ev-dialog{@apply fixed inset-0 z-[26] grid place-items-center bg-[rgba(10,10,20,.5)] p-6 opacity-0 pointer-events-none transition-opacity duration-200 data-[open=true]:opacity-100 data-[open=true]:pointer-events-auto}
 .ev-dialog-card{@apply grid w-[min(100%,340px)] scale-95 gap-2 rounded-[28px] bg-surface px-5 pb-5 pt-6 transition-transform duration-300 ease-spring}
 .ev-dialog[data-open="true"] .ev-dialog-card{@apply scale-100}
 .ev-pop{@apply fixed z-[27] min-w-[220px] max-w-[calc(100vw-16px)] scale-90 rounded-[22px] bg-surface p-1.5 opacity-0 pointer-events-none shadow-[0_12px_36px_rgba(0,0,0,.2),0_0_0_1px_var(--c-line)] transition-[opacity,transform] duration-200 ease-spring data-[open=true]:scale-100 data-[open=true]:opacity-100 data-[open=true]:pointer-events-auto}
 .ev-drawer-scrim{@apply absolute inset-0 z-[2] pointer-events-none !max-w-none bg-[rgba(10,10,20,.45)] opacity-0 transition-opacity duration-300 data-[open=true]:pointer-events-auto data-[open=true]:opacity-100}
 .ev-drawer{@apply absolute inset-y-0 left-[max(0px,calc(50%_-_var(--col-max)/2))] z-[3] flex !w-[min(86vw,330px)] !max-w-none -translate-x-[102%] touch-pan-y flex-col rounded-r-[28px] bg-bg pt-[env(safe-area-inset-top,0px)] transition-transform duration-[360ms] ease-out-expo data-[open=true]:translate-x-0 data-[open=true]:shadow-[0_0_40px_rgba(0,0,0,.22)] data-[drag=true]:transition-none}
 .ev-composer{@apply mx-3 mb-[calc(12px+env(safe-area-inset-bottom,0px))] grid !w-[calc(100%-24px)] gap-1 rounded-[30px] bg-surface py-2.5 pl-4 pr-2.5 shadow-[0_8px_30px_rgba(20,20,30,.12),0_0_0_1px_var(--c-line)]}
}

/* ============ v15: MOTION + LAYOUT FIXES ============
   เหตุผลการออกแบบ (จากแนวทาง Material 3 "fade through"/"shared axis" + หลักเพิ่มประสิทธิภาพบนเครื่องไม่แรง):
   1) อนิเมชั่นทุกตัวใช้เฉพาะ transform + opacity (วิ่งบน compositor ไม่กระตุ้น layout/paint) — ไม่ใช้ blur / ปรับ shadow / ปรับขนาด
   2) เข้า: เร่งเร็วแล้วชะลอ (decelerate ~460ms) · ออก: สั้นกว่าและเร่ง (accelerate ~220ms) — ออกเร็วกว่าเข้าเสมอ
   3) หน้าซ้อนกันไม่เลื่อนจากข้าง จึงไม่มีอะไรโผล่ข้างจอ · มี contain:paint + overflow:hidden ตัดทุกอย่างให้อยู่ในหน้า
   4) เครื่องช้า (html[data-perf="lite"]) → เหลือแค่ fade สั้น ๆ ไม่มี scale/stagger · ตรวจจับอัตโนมัติ + ปรับเองได้ในตั้งค่า */
.ev-page{position:fixed;inset:0;z-index:22;display:flex;flex-direction:column;align-items:center;background:var(--c-bg);pointer-events:none;touch-action:pan-y;overflow:hidden;contain:layout paint;
  opacity:0;transform:translate3d(0,14px,0) scale(.965);transform-origin:50% 55%;
  transition:opacity .2s cubic-bezier(.4,0,1,1),transform .22s cubic-bezier(.4,0,1,1)}
.ev-page[data-open="true"]{opacity:1;transform:none;pointer-events:auto;
  transition:opacity .3s cubic-bezier(0,0,.2,1),transform .46s cubic-bezier(.05,.7,.1,1)}
.ev-page[data-drag="true"]{transition:none}
/* ปัดกลับจากขอบจอ: ตามนิ้วแล้วออกไปทางขวา (ยังเป็นท่าทางแบบแอปจริง) */
.ev-page[data-exit="x"]:not([data-open="true"]){opacity:1;transform:translate3d(100%,0,0);transition:transform .28s cubic-bezier(.3,0,.8,.15)}
/* เนื้อหาในหน้าไหลขึ้นทีละนิด (เฉพาะตอนเปิด ไม่เกิน 6 ชิ้นแรก) */
.ev-page[data-enter] .ev-page-scroll>*{animation:pgIn .52s var(--ease) both}
.ev-page[data-enter] .ev-page-scroll>*:nth-child(2){animation-delay:45ms}.ev-page[data-enter] .ev-page-scroll>*:nth-child(3){animation-delay:90ms}
.ev-page[data-enter] .ev-page-scroll>*:nth-child(4){animation-delay:135ms}.ev-page[data-enter] .ev-page-scroll>*:nth-child(5){animation-delay:180ms}
.ev-page[data-enter] .ev-page-scroll>*:nth-child(6){animation-delay:225ms}.ev-page[data-enter] .ev-page-scroll>*:nth-child(n+7){animation:none}
@keyframes pgIn{from{opacity:0;transform:translate3d(0,16px,0)}}

/* Sheet: เข้าแบบชะลอ ออกแบบเร่ง (เร็วกว่า) */
.ev-sheet{transition:transform .26s cubic-bezier(.3,0,.8,.15)}
.ev-sheet[data-open="true"]{transition:transform .46s cubic-bezier(.05,.7,.1,1)}
.ev-sheet[data-drag="true"]{transition:none}
.ev-scrim{transition:opacity .28s cubic-bezier(.4,0,.2,1)}

/* แถบข้าง (drawer): ซ่อนจริงเมื่อปิด ไม่โผล่ขอบจอตอนหน้าเลื่อนเข้า/ออก */
.ev-drawer{visibility:hidden;transition:transform .3s cubic-bezier(.3,0,.8,.15),visibility 0s linear .3s}
.ev-drawer[data-open="true"],.ev-drawer[data-drag="true"]{visibility:visible;transition:transform .44s cubic-bezier(.05,.7,.1,1),visibility 0s}
.ev-drawer[data-drag="true"]{transition:none}
.ev-drawer-scrim{transition:opacity .3s cubic-bezier(.4,0,.2,1)}

/* หน้าตั้งค่า/ทุกหน้า: เลย์เอาต์ยืดหยุ่นพอดีจอ (เดิมคอลัมน์ grid ขยายตามเนื้อหาที่กว้างที่สุดจนล้นจอ) */
.ev-page-scroll{grid-template-columns:minmax(0,1fr);overflow-x:hidden}
.ev-page-scroll>*,.ev-card,.ev-set,.ev-form,.ev-block{min-width:0}
.ev-stat>*{min-width:0}.ev-stat .ev-chip{flex:none}
.ev-sub{overflow-wrap:anywhere}
.ev-seg{grid-auto-columns:minmax(0,1fr)}
.ev-seg button{min-width:0;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.ev-seg button{font-size:13px;padding:0 4px}}

/* ความรู้สึกกดปุ่ม (transform ล้วน) */
.ev-sugg button,.ev-btn-primary,.ev-btn-ghost,.ev-btn-danger,.ev-navrow{transition:transform .18s var(--ease),opacity .18s,background-color .18s}
.ev-sugg button:active,.ev-btn-primary:active,.ev-btn-ghost:active,.ev-btn-danger:active,.ev-navrow:active{transform:scale(.97)}

/* โหมดประหยัดเครื่อง */
html[data-perf="lite"] .ev-page{transform:none;transition:opacity .16s linear}
html[data-perf="lite"] .ev-page[data-open="true"]{transition:opacity .2s cubic-bezier(0,0,.2,1)}
html[data-perf="lite"] .ev-page[data-exit="x"]:not([data-open="true"]){transition:transform .22s ease-out}
html[data-perf="lite"] .ev-page[data-enter] .ev-page-scroll>*{animation:none}
html[data-perf="lite"] .ev-sheet{transition-duration:.24s!important}
html[data-perf="lite"] .ev-dial[data-run="true"],html[data-perf="lite"] .ev-skeleton{animation:none}

/* ============ v16: DESIGN PASS — พื้นที่โปร่งขึ้น · นิ่งขึ้น · โค้งมนขึ้น · มี "วงแหวน" เป็นลายเซ็น ============
   แนวคิด: Ordivel = วงโคจร (ดูโลโก้) — วงแหวนบาง ๆ ปรากฏซ้ำอย่างเงียบ ๆ ในจุดสำคัญ (การ์ดสรุป · หน้า AI · ปุ่มเพิ่ม) แทนการตกแต่งเยอะ
   - สีกลางอมม่วงอ่อน ๆ เข้ากับสีหลัก (แทนเทาเย็น) · แยกพื้นผิวด้วย "โทนสี" มากกว่าเส้นขอบ/เงา
   - ระยะห่างเพิ่มจาก 16→20 · มุมการ์ด 26→32 · น้ำหนักตัวอักษรเบาลง (700→600) · ความสูงบรรทัดเพิ่ม (ภาษาไทยอ่านสบายขึ้น)
   - แอนิเมชั่นลดการเด้ง (overshoot) ให้นิ่ง · ใช้ transform/opacity เท่านั้นเหมือนเดิม */
:root{--s1:10px;--s2:20px;--s3:28px;--s4:40px;--r-card:32px;--r-sheet:38px;--nav-h:64px;
  /* v26 radius scale: โค้งมนมากขึ้นในทุกจุดรอง (ปุ่ม/ชิป/ไทล์) — การ์ดใหญ่คง 32 ไว้เพื่อไม่ให้ลายเซ็นเปลี่ยน */
  --r-xs:12px;--r-s:16px;--r-m:22px;--r-l:28px;--r-xl:34px;
  --c-bg:#F5F4F9;--c-surface:#fff;--c-text:#1C1B26;--c-muted:#767487;--c-line:#E9E7F0;--c-fill:#EFEEF5;--c-accent-soft:#EEF2FF;
  --shadow:0 1px 2px rgba(40,30,90,.04);--spring:cubic-bezier(.3,1.2,.5,1);--c-halo:rgba(79,70,229,.05);
  /* v26 เงานุ่ม 2 ชั้น: เส้นขอบจาง + พื้นลอย — ทำให้การ์ดดูมีมิติแบบแอปจริง (TickTick/Things) */
  --shadow-s:0 1px 2px rgba(40,30,90,.05),0 6px 18px rgba(40,30,90,.05);--shadow-m:0 2px 6px rgba(40,30,90,.07),0 16px 36px rgba(40,30,90,.11)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-bg:#0F0E15;--c-surface:#191822;--c-text:#F1F0F6;--c-muted:#9B99AC;--c-line:#2A2935;--c-fill:#232230;--c-accent-soft:#23234A;--shadow:none;--c-halo:rgba(129,140,248,.07);--shadow-s:0 0 0 1px rgba(255,255,255,.05);--shadow-m:0 12px 34px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--c-bg:#0F0E15;--c-surface:#191822;--c-text:#F1F0F6;--c-muted:#9B99AC;--c-line:#2A2935;--c-fill:#232230;--c-accent-soft:#23234A;--shadow:none;--c-halo:rgba(129,140,248,.07);--shadow-s:0 0 0 1px rgba(255,255,255,.05);--shadow-m:0 12px 34px rgba(0,0,0,.4)}
html[data-perf="lite"]{--shadow:none;--shadow-s:none;--shadow-m:none}
body{line-height:1.55;letter-spacing:.005em}
.ev-header{padding:calc(var(--s2) + 2px) var(--s2) 6px}
.ev-title{font-size:30px;font-weight:600;letter-spacing:-.6px;padding-bottom:16px;line-height:1.3}
.ev-section-title{font-size:17px;font-weight:600;margin-top:var(--s2)}
.ev-group{font-size:12.5px;letter-spacing:.06em;padding:22px 0 4px}
.ev-main{gap:18px}
.ev-card{padding:var(--s2)}
.ev-list-item{padding:14px 0}.ev-list-item[data-next="true"]::before{left:-20px}
.ev-chip{padding:5px 13px}

/* การ์ดสรุป: ไล่สีม่วงนุ่ม + วงแหวนจาง ๆ (ลายเซ็น) */
.ev-card[data-tone="ink"]{--c-bg:#fff;--c-on-ink-soft:rgba(255,255,255,.22);position:relative;overflow:hidden;isolation:isolate;color:#fff;
  background:linear-gradient(150deg,var(--c-ink-a) 0%,var(--c-ink-b) 55%,var(--c-ink-c) 100%);box-shadow:0 14px 34px rgba(79,70,229,.2)}
/* v26: การ์ดสรุปหน้าวันนี้เป็นวงแหวน (Habitify: daily progress ring + รายการ) */
.ev-sum-ring{position:relative;width:112px;height:112px;flex:none}
.ev-sum-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ev-sum-ring circle{fill:none;stroke-width:8}.ev-sum-ring .rg-bg{stroke:var(--c-on-ink-soft)}.ev-sum-ring .rg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ev-sum-ringnum{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700;letter-spacing:-1px}
.ev-sum-ringnum small{font-size:14px;opacity:.65;font-weight:600;letter-spacing:0}
.ev-cheer{display:flex;align-items:center;gap:8px;font-weight:600}
.ev-cheer svg{width:18px;height:18px;color:#FFD666}
.ev-card[data-tone="ink"]::before{content:"";position:absolute;z-index:-1;right:-72px;top:-72px;width:200px;height:200px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 30px rgba(255,255,255,.06),0 0 0 62px rgba(255,255,255,.04),0 0 0 98px rgba(255,255,255,.025)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev-card[data-tone="ink"]{background:linear-gradient(150deg,#2D2380,#43379F 60%,#5F51CC);box-shadow:none}}
:root[data-theme="dark"] .ev-card[data-tone="ink"]{background:linear-gradient(150deg,#2D2380,#43379F 60%,#5F51CC);box-shadow:none}
html[data-perf="lite"] .ev-card[data-tone="ink"]{box-shadow:none}
.ev-sum{padding:26px;gap:20px}.ev-sum-num{font-size:52px;font-weight:600;letter-spacing:-2px}.ev-sum-lab{font-size:13.5px;opacity:.78}
.ev-prog{height:7px}.ev-prog i{border-radius:7px}

/* ปุ่ม / ฟอร์ม: ใหญ่ขึ้น โค้งขึ้น */
.ev-btn-primary,.ev-btn-ghost,.ev-btn-danger,.ev-btn-solid-danger,.ev-btn-ink{height:52px;padding:0 26px}
.ev-icon-btn{box-shadow:none}.ev-icon-btn,.ev-avatar{width:42px;height:42px}
.ev-avatar{font-weight:600}
.ev-ai-pill{height:40px;padding:0 16px 0 12px;background:var(--c-accent-soft);color:var(--c-accent-text)}
.ev-input{height:52px;border-radius:22px;padding:0 var(--s2)}
.ev-input:focus{box-shadow:0 0 0 5px var(--c-accent-soft)}
.ev-set{border-radius:26px}.ev-set-row{min-height:54px;padding:0 18px}.ev-panel-in{padding:2px 18px 18px}
.ev-seg{padding:5px}.ev-seg button{height:38px}
.ev-seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(40,30,90,.1)}
.ev-filters{gap:10px}.ev-filters button{height:40px;padding:0 18px}
.ev-week{gap:8px}.ev-week button{border-radius:24px;padding:10px 0}.ev-week button[aria-pressed="true"]{transform:none}
.ev-type{border-radius:28px;padding:18px;border-width:1px}
.ev-form{gap:var(--s2)}

/* แถบนำทางล่าง */
.ev-nav{border-radius:36px;box-shadow:0 12px 32px rgba(40,30,90,.09),0 0 0 1px var(--c-line)}
.ev-nav button{font-size:11.5px}.ev-nav .pill{width:56px;height:32px;border-radius:16px}
.ev-nav button[aria-current="page"]{color:var(--c-accent-text)}.ev-nav button[aria-current="page"] .pill{background:var(--c-accent-soft)}
.ev-nav button[aria-current="page"] .pill svg{transform:none}
.ev-nav .add{width:50px;height:50px;position:relative}
.ev-nav .add::after{content:"";position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 0 1px var(--c-accent-soft);pointer-events:none}

/* ชั้นลอย: sheet · dialog · popover */
.ev-sheet{border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -10px 44px rgba(20,15,50,.14)}
.ev-sheet h2{font-size:19px;font-weight:600;padding:6px 14px 10px var(--s2)}
.ev-sheet-body{padding:12px var(--s2) var(--s3)}
.ev-sheet-foot{padding:14px var(--s2) calc(14px + env(safe-area-inset-bottom,0))}
.ev-grab::before{width:36px;background:var(--c-line)}
.ev-dialog-card{width:min(100%,360px);border-radius:34px;padding:28px 24px 24px}
.ev-dialog-card,.ev-pop{transition-timing-function:cubic-bezier(.22,1,.36,1)}
.ev-pop{border-radius:26px;padding:8px}.ev-pop button{min-height:50px;border-radius:18px}
.ev-toast{min-height:56px}

/* หน้าเต็มจอ */
.ev-page-bar{padding:calc(env(safe-area-inset-top,0) + 14px) var(--s2) 10px}.ev-page-bar h2{font-size:21px;font-weight:600}
.ev-page-scroll{padding:var(--s1) var(--s2) calc(var(--s4) + env(safe-area-inset-bottom,0));gap:18px}

/* หน้า AI: ลมหายใจ + ฮาโลวงแหวนหลังเครื่องหมาย */
.ev-aibar{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px}
.ev-ai-hello{position:relative;isolation:isolate;gap:16px;padding:40px 8px 28px}
.ev-ai-hello::before{content:"";position:absolute;z-index:-1;left:50%;top:66px;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 30px var(--c-halo),0 0 0 62px var(--c-halo),0 0 0 98px var(--c-halo)}
.ev-ai-mark{width:56px;height:56px}
.ev-ai-hello h3{font-size:28px;font-weight:600;letter-spacing:-.5px}
.ev-sugg{gap:10px;margin-top:10px}
.ev-sugg button{height:44px;padding:0 20px;background:var(--c-surface);box-shadow:0 0 0 1px var(--c-line)}
.ev-chat{gap:14px}
.ev-bubble-user,.ev-bubble-ai{padding:14px 18px;border-radius:24px;line-height:1.6}
.ev-bubble-user{border-bottom-right-radius:8px}.ev-bubble-ai{border-bottom-left-radius:8px}
.ev-composer{border-radius:34px;padding:12px 12px 12px 20px;box-shadow:0 10px 32px rgba(40,30,90,.10),0 0 0 1px var(--c-line)}
.ev-composer textarea{line-height:1.55}
.ev-plus,.ev-send{width:42px;height:42px}.ev-send{background:var(--c-accent);color:var(--c-on-accent)}
.ev-notice{border-radius:24px;padding:16px 18px}.ev-limit{border-radius:24px;padding:12px 12px 12px 14px}
.ev-roundbtn,.ev-backpill,.ev-capsule{box-shadow:0 0 0 1px var(--c-line)}
.ev-drawer{border-radius:0 34px 34px 0}
.ev-drawer-head{padding:22px 20px 10px}.ev-navrow{height:52px}
.ev-chat-row>button:first-child{height:48px}

/* ความนิ่ง: ลดการเด้ง */
.ev-dial[data-run="true"]{animation-name:breathe-soft}@keyframes breathe-soft{50%{transform:scale(1.01)}}
.ev-msg-actions button[aria-pressed="true"]{transform:scale(1.06)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
/* ความรู้สึกแอปจริง: เลือกข้อความเฉพาะเนื้อหา · ไม่ดึงรีเฟรชในแอป · เลื่อนไม่ทะลุ */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.ev-bubble-user,.ev-bubble-ai,.ev-notice{-webkit-user-select:text;user-select:text}
body[data-auth="in"]{overscroll-behavior-y:contain}
.ev-page-scroll,.ev-sheet-body,.ev-drawer-list,.fc-scroller{overscroll-behavior:contain}
.ev-composer{transition:margin-bottom .2s var(--ease)}

/* ============ v17: แก้ปุ่ม AI · ตัวอักษรพอดีตา · contrast ============
   - ขนาดตัวอักษรลดลงเล็กน้อยทุกระดับ (หัวเรื่อง 30→26, ตัวเลขสรุป 52→42, ข้อความหลัก 15→14.5)
   - contrast: เส้นของปุ่มควบคุม (วงติ๊ก ช่องกรอก สวิตช์) ใช้ --c-line-ctl ≥ 3:1 · ข้อความสีเหลือง/แดง/เขียวใช้โทนเข้มแยกจากสีเติม
   - กรอบสีเหลือง (ค้างอยู่ · ขีดจำกัดการใช้งาน) กำหนดโทเคนสีของตัวเองให้เส้น วงกลม ปุ่มมองเห็นชัดทั้งสองธีม */
:root{--c-muted:#65637A;--c-line:#E1DFEB;--c-line-ctl:#8E8CA3;--c-ok:#0E8A55;--c-on-ok:#fff;--c-ok-text:#0A6E43;--c-warn-text:#8F5200;--c-danger-text:#B42318;--c-danger-fill:#C7312F;
  --warn-line:rgba(143,82,0,.28);--warn-ctl:#A5772A;--warn-muted:#7A5410;--warn-fill:rgba(143,82,0,.12);--warn-surface:#FFFBF3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--c-muted:#A3A1B5;--c-line:#363544;--c-line-ctl:#77758E;--c-ok:#3DD598;--c-on-ok:#04251A;--c-ok-text:#5BE0A8;--c-warn:#F5A524;--c-warn-text:#FFC069;--c-danger:#FF6B70;--c-danger-text:#FF9A9E;--c-danger-fill:#CB3A3E;--shadow:0 0 0 1px rgba(255,255,255,.06);
  --warn-line:rgba(255,192,105,.25);--warn-ctl:#C49A55;--warn-muted:#E2C48F;--warn-fill:rgba(255,192,105,.14);--warn-surface:#2B2210}}
:root[data-theme="dark"]{color-scheme:dark;--c-muted:#A3A1B5;--c-line:#363544;--c-line-ctl:#77758E;--c-ok:#3DD598;--c-on-ok:#04251A;--c-ok-text:#5BE0A8;--c-warn:#F5A524;--c-warn-text:#FFC069;--c-danger:#FF6B70;--c-danger-text:#FF9A9E;--c-danger-fill:#CB3A3E;--shadow:0 0 0 1px rgba(255,255,255,.06);
  --warn-line:rgba(255,192,105,.25);--warn-ctl:#C49A55;--warn-muted:#E2C48F;--warn-fill:rgba(255,192,105,.14);--warn-surface:#2B2210}
::placeholder{color:var(--c-muted);opacity:.8}

/* ขนาดตัวอักษร */
body{font-size:14.5px}
.ev-title{font-size:26px;padding-bottom:12px}
.ev-section-title{font-size:16px}
.ev-group{font-size:12px}
.ev-sub{font-size:13px}
.ev-sum{padding:22px;gap:18px}
.ev-sum-num{font-size:42px;letter-spacing:-1.5px}.ev-sum-num small{font-size:18px;opacity:.7}
.ev-sum-lab{font-size:13px;opacity:.92}
.ev-big{font-size:24px}.ev-big small{font-size:14px}
.ev-stats3 b{font-size:21px}
.ev-ringbox{width:104px;height:104px}.ev-ringnum{font-size:24px}.ev-ringnum small{font-size:13px}
.ev-digits{font-size:clamp(36px,11vw,48px)}
.ev-sheet h2{font-size:17px}.ev-page-bar h2{font-size:18px}
.ev-dialog-card h3{font-size:17px}
.ev-title-input{font-size:17px;height:46px}
.ev-btn-primary,.ev-btn-ghost,.ev-btn-danger,.ev-btn-solid-danger,.ev-btn-ink{font-size:14.5px;height:50px}
.ev-btn-sm{height:36px;font-size:13.5px}
.ev-btn-auth{font-size:15px;height:52px}
.ev-avatar{font-size:14px}
.ev-set-row{font-size:14.5px}
.ev-cal-title{font-size:16px}.ev-weekbar b{font-size:14px}.ev-week b{font-size:15px}
.ev-ai-hello h3{font-size:23px}.ev-ai-mark{width:48px;height:48px}
.ev-sugg button{height:40px;font-size:13px}
.ev-bubble-user,.ev-bubble-ai{font-size:14.5px;padding:12px 16px}
.ev-auth-title{font-size:26px}
.ev-brand b{font-size:38px}.ev-brand .mark{width:54px;height:54px}
.ev-hero-s .ev-brand b{font-size:26px}.ev-hero-s .ev-brand .mark{width:36px;height:36px}
.ev-nav button{font-size:11px}

/* contrast: เส้นและวงกลมของปุ่มควบคุม */
.ev-check{border:2px solid var(--c-line-ctl)}
.ev-check[aria-checked="true"]{border-color:var(--c-ok)}
.ev-check:disabled{opacity:.55}
.ev-input,.ev-unit{border-color:var(--c-line-ctl)}
.ev-title-input{border-bottom-color:var(--c-line-ctl)}
.ev-switch{background:var(--c-line-ctl)}
.ev-btn-auth[data-kind="google"]{box-shadow:0 0 0 1.5px var(--c-line-ctl)}
.ev-legend i[data-state="off"]{border-color:var(--c-line-ctl)}
.ev-bar,.ev-col-track{background:var(--c-line)}
.fc .ev-fcday.st-off .ev-dnum{opacity:.5}.fc .ev-fcday.st-future .ev-dnum{opacity:.75}
.ev-bubble-ai{box-shadow:0 0 0 1px var(--c-line)}

/* contrast: สีสถานะ (เขียว · เหลือง · แดง) แยก "สีเติม" กับ "สีตัวอักษร" */
.fc .ev-fcday.st-done .ev-dnum{background:var(--c-ok);color:var(--c-on-ok)}
.ev-chip[data-state="done"],.ev-pct[data-lv="hi"],.fc .fc-event.ev-fc-habit{color:var(--c-ok-text)}
.ev-chip[data-state="soon"],.ev-pct[data-lv="mid"],.fc .fc-event.ev-fc-task,.ev-limit-ic{color:var(--c-warn-text)}
.ev-chip[data-state="late"],.ev-btn-danger,.ev-form-err,.ev-field-err,.ev-banner,.ev-pct[data-lv="lo"],.ev-pop button[data-tone="danger"],.ev-pop button[data-tone="danger"] svg{color:var(--c-danger-text)}
.ev-btn-solid-danger{background:var(--c-danger-fill);color:#fff}

/* กรอบสีเหลือง: ให้เส้น วงกลม ปุ่ม และข้อความรองในกรอบอ่านชัด */
.ev-card[data-tone="warn"],.ev-limit{--c-line:var(--warn-line);--c-line-ctl:var(--warn-ctl);--c-muted:var(--warn-muted);--c-fill:var(--warn-fill);--c-surface:var(--warn-surface)}

/* ปุ่ม/ตัวเลือกที่วางบนพื้นสีเทาอ่อน (--c-fill) ต้องไม่กลืนกับพื้น */
.ev-card[data-tone="soft"] .ev-btn-ghost,.ev-notice .ev-btn-ghost,.ev-set .ev-btn-ghost,.ev-set .ev-step button{background:var(--c-surface);box-shadow:inset 0 0 0 1px var(--c-line)}
.ev-set .ev-seg{background:var(--c-line)}

/* การ์ดสรุป: ปลายไล่สีเข้มขึ้นให้ตัวอักษรสีขาวอ่านชัด */
.ev-card[data-tone="ink"]{background:linear-gradient(150deg,var(--c-ink-a) 0%,var(--c-ink-b) 55%,var(--c-ink-c) 100%)}
/* ===== v25: Markdown ในบับเบิล AI (คัดจากระบบจริง) ===== */
.ev-page[data-page="ai"] .ev-bubble-ai.ev-md{
  width:100%;
  box-sizing:border-box;
  min-width:0;
  overflow-wrap:anywhere
}

/* ===== Markdown ในบับเบิล AI (.ev-md) — สีจากโทเคน ใช้ได้ทั้งโหมดสว่าง/มืด ===== */

.ev-md{
  white-space:normal !important;
  line-height:1.65
}

.ev-md>*:first-child{
  margin-top:0
}

.ev-md>*:last-child{
  margin-bottom:0
}

.ev-md-p{
  margin:0 0 10px;
  white-space:pre-wrap
}

.ev-md-h{
  margin:16px 0 8px;
  line-height:1.35;
  font-weight:700;
  letter-spacing:-.2px
}

.ev-md-h1{
  font-size:20px
}

.ev-md-h2{
  font-size:18px
}

.ev-md-h3{
  font-size:16.5px
}

.ev-md-h4,.ev-md-h5,.ev-md-h6{
  font-size:15px
}

.ev-md-h5,.ev-md-h6{
  color:var(--c-muted)
}

.ev-md strong{
  font-weight:700
}

.ev-md em{
  font-style:italic
}

.ev-md del{
  opacity:.6
}

.ev-md-a{
  color:var(--c-accent-text,var(--c-accent));
  text-decoration:underline;
  text-underline-offset:2px;
  word-break:break-word
}

.ev-md-code{
  font:500 .88em/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--c-fill);
  border-radius:6px;
  padding:2px 6px
}

.ev-md-pre{
  position:relative;
  margin:10px 0;
  background:var(--c-fill);
  border-radius:14px;
  overflow:hidden
}

.ev-md-lang{
  display:block;
  padding:8px 14px 0;
  font:600 11px/1 var(--font);
  letter-spacing:.4px;
  text-transform:uppercase;
  color:var(--c-muted)
}

.ev-md-pre pre{
  margin:0;
  padding:10px 14px 12px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain
}

.ev-md-pre code{
  font:400 13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre;
  display:block;
  min-width:-moz-max-content;
  min-width:max-content
}

.ev-md-list{
  margin:0 0 10px;
  padding-left:22px
}

.ev-md-list .ev-md-list{
  margin:4px 0 2px
}

.ev-md-li{
  margin:3px 0;
  padding-left:2px
}

.ev-md-li::marker{
  color:var(--c-muted)
}

.ev-md-task{
  list-style:none;
  margin-left:-20px
}

.ev-md-check{
  width:16px;
  height:16px;
  margin:0 8px 0 0;
  vertical-align:-2px;
  accent-color:var(--c-accent)
}

.ev-md-quote{
  margin:10px 0;
  padding:2px 0 2px 14px;
  border-left:3px solid var(--c-line);
  color:var(--c-muted)
}

.ev-md-quote .ev-md-p:last-child{
  margin-bottom:0
}

.ev-md-hr{
  border:0;
  border-top:1px solid var(--c-line);
  margin:16px 0
}

.ev-md-tablewrap{
  margin:10px 0;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--c-line);
  border-radius:12px
}

.ev-md-table{
  border-collapse:collapse;
  width:100%;
  min-width:-moz-max-content;
  min-width:max-content;
  font-size:14px
}

.ev-md-table th,.ev-md-table td{
  padding:9px 14px;
  border-bottom:1px solid var(--c-line);
  text-align:left;
  vertical-align:top
}

.ev-md-table th{
  background:var(--c-fill);
  font-weight:600;
  white-space:nowrap
}

.ev-md-table tr:last-child td{
  border-bottom:0
}

.ev-md-table td+td,.ev-md-table th+th{
  border-left:1px solid var(--c-line)
}

/* ปฏิกิริยาตอนกด (native feel): ปุ่มที่แตะบ่อยสุดเคยกดแล้วเงียบ วัดจริงด้วย CDP forcePseudoState 23 ต.ค. 2026
   ใช้ภาษาเดิม (scale .94-.97, --t-fast, --ease) ไม่เพิ่ม token ใหม่ เจาะด้วย attribute เพราะ DOM มาจากทั้ง .ts และ React */

.ev-check,[data-act="settings"],[data-act="date"]{
  transition-property:background,border-color,color,transform;
  transition-duration:var(--t-fast);
  transition-timing-function:var(--ease)
}

.ev-check:active{
  transform:scale(.88)
}


/* ============ v19: bottom sheet ปรับความสูงนุ่ม + เนื้อหาเข้าเป็นจังหวะ · อวาตาร์โปรไฟล์ระบบกลาง ============
   ความสูง: JS วัดก่อน/หลังเปลี่ยนเนื้อหา แล้ว transition เฉพาะ height ชั่วครู่ (.34s) แล้วคืนเป็น auto — ไม่มี animation ค้างตลอดเวลา
   เนื้อหา: เปลี่ยนขั้นตอน (เลือกประเภท ↔ ฟอร์ม) แต่ละรายการไหลเข้าทีละนิดด้วย transform+opacity เท่านั้น · โหมดประหยัดเครื่องตัดทั้งหมด */
.ev-sheet[data-resize]{transition:transform .46s cubic-bezier(.05,.7,.1,1),height .34s cubic-bezier(.22,1,.36,1)}
.ev-sheet[data-resize] .ev-sheet-body{overflow:hidden}
@keyframes sheetIn{from{opacity:0;transform:translate3d(0,12px,0)}}
.ev-sheet .ev-in{animation:sheetIn .34s var(--ease) both}
.ev-sheet[data-stage] .ev-in{animation:none}
.ev-sheet[data-stage] .ev-form>*,.ev-sheet[data-stage] .ev-types>*{animation:sheetIn .42s var(--ease) both}
.ev-sheet[data-stage] .ev-form>*:nth-child(2),.ev-sheet[data-stage] .ev-types>*:nth-child(2){animation-delay:45ms}
.ev-sheet[data-stage] .ev-form>*:nth-child(3),.ev-sheet[data-stage] .ev-types>*:nth-child(3){animation-delay:90ms}
.ev-sheet[data-stage] .ev-form>*:nth-child(4),.ev-sheet[data-stage] .ev-types>*:nth-child(4){animation-delay:135ms}
.ev-sheet[data-stage] .ev-form>*:nth-child(5){animation-delay:180ms}
.ev-sheet[data-stage] .ev-form>*:nth-child(n+6){animation-delay:225ms}
html[data-perf="lite"] .ev-sheet[data-stage] .ev-form>*,html[data-perf="lite"] .ev-sheet[data-stage] .ev-types>*{animation:none}
html[data-perf="lite"] .ev-sheet .ev-in{animation-duration:.2s}
.ev-avatar{display:grid;place-items:center;flex:none;line-height:1;width:var(--sz,42px);height:var(--sz,42px);font-size:calc(var(--sz,42px)*.4);font-weight:600;color:#fff;background:var(--av,var(--c-accent))}

/* ============ v20: ช่องเวลามีสถานะ · ปฏิทินโปร่งแบบ native · Today/สถิตินิ่งและโล่งสบาย ============ */
.ev-tbox-w{display:flex;align-items:center;gap:8px}.ev-tbox-h{font-size:12px;color:var(--c-muted)}
.ev-tbox{position:relative;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent-text);font-weight:600;font-size:14px;overflow:hidden;cursor:pointer}
.ev-tbox[data-empty="true"]{background:var(--c-fill);color:var(--c-muted);box-shadow:inset 0 0 0 1.5px var(--c-line)}
.ev-tbox input{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:0;cursor:pointer;font-size:16px}
html[data-settled] #app .ev-in,html[data-settled] .ev-page .ev-in,html[data-settled] #app.ev-enter>*,html[data-settled] #app.ev-enter .ev-list-item,html[data-settled] #app.ev-enter .ev-bars i,html[data-settled] .ev-page .ev-page-scroll>*{animation:none!important}
.ev-icon,.ev-icon *,.ev-set-row small,.ev-set-row small *,.ev-link-btn svg{animation:none!important}
body{line-height:1.5;letter-spacing:0}
.ev-empty-note{padding:10px 14px;border-radius:14px;background:var(--c-fill);color:var(--c-muted);font-size:13px}
.ev-tx{width:30px;height:30px;border-radius:50%;border:0;background:var(--c-fill);color:var(--c-muted);font-size:12px;cursor:pointer}
.ev-main{gap:20px;padding-bottom:24px}.ev-card{padding:22px}
.ev-sum{padding:28px;gap:20px}.ev-sum-num{font-size:56px}.ev-sum-lab{font-size:14px}
.ev-next{margin-top:2px;font-size:14px}.ev-group{padding:22px 0 6px;font-size:12.5px}
.ev-list-item{padding:16px 0;gap:14px;animation:none!important}.ev-list-item .ev-sub{margin-top:3px}
.ev-ringbox{width:132px;height:132px}.ev-sum-row{gap:26px}.ev-row2{gap:20px}.ev-big{margin-top:6px}
.ev-chart{gap:10px;margin-top:22px}.ev-col{grid-template-rows:auto 130px auto;gap:10px}.ev-col-track{max-width:30px;background:var(--c-fill)}
.ev-stats3{gap:12px}.ev-stats3 b{font-size:24px}
.ev-fc-wrap{background:transparent;box-shadow:none;padding:4px 0}
.fc .fc-daygrid-day-frame{min-height:68px;padding:6px 0}.ev-dnum{width:34px;height:34px;font-size:15px}
.fc .fc-day-disabled,.fc .fc-daygrid-day.fc-day-other,.fc .fc-daygrid-day-bg .fc-non-business{background:transparent!important}
.ev-sheet .ev-sheet-foot,.ev-sheet .ev-sheet-foot *,.ev-sheet h2,.ev-sheet h2 *{animation:none!important}
.fc .fc-col-header-cell-cushion{padding:10px 0;font-size:13px}
.fc .fc-timegrid-slot{height:60px}.fc .fc-event{border-radius:12px}
#agenda .ev-card{padding:22px}

/* ============ v26: คอมโพเนนต์ใหม่ (อ้างอิงตัวอย่างจริง) ============
   ช่องวันที่แบบแท่ง (Habitify New Habit: start date เป็นแถวหลัก) · ชิปวันด่วน
   ไทล์ติ๊กวงใหญ่ 64px (Streaks big-button) · เปลวไฟ streak · ฉลองครบวัน */
.ev-dbox{position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 14px;border-radius:var(--r-pill);background:var(--c-accent-soft);color:var(--c-accent-text);font-weight:600;font-size:14.5px;overflow:hidden;cursor:pointer;white-space:nowrap}
.ev-dbox svg{width:17px;height:17px;flex:none}
.ev-dbox[data-empty="true"]{background:var(--c-fill);color:var(--c-muted);box-shadow:inset 0 0 0 1.5px var(--c-line-ctl)}
.ev-dbox input{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:0;cursor:pointer;font-size:16px}
.ev-qd{display:flex;gap:7px;flex-wrap:wrap}
.ev-qd button{height:34px;padding:0 15px;border-radius:var(--r-pill);border:0;background:var(--c-fill);color:var(--c-text);font:600 13.5px var(--font);transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease)}
.ev-qd button:active{transform:scale(.94)}
.ev-qd button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent)}
.ev-set .ev-qd button{background:var(--c-surface);box-shadow:inset 0 0 0 1.5px var(--c-line-ctl)}
.ev-set .ev-qd button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent);box-shadow:none}
/* ไทล์กิจวัตร: ติ๊กวงใหญ่ 64px + วงแหวนความคืบหน้า (นับเป้า/จับเวลา) + เปลวไฟ streak */
.ev-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev-tile{position:relative;display:grid;justify-items:center;gap:9px;padding:18px 10px 14px;border-radius:var(--r-card);background:var(--c-bg);box-shadow:inset 0 0 0 1px var(--c-line);transition:transform var(--t-fast) var(--ease)}
.ev-tile:active{transform:scale(.97)}
.ev-tile[data-done="true"]{background:var(--c-accent-soft);box-shadow:inset 0 0 0 1.5px transparent}
.ev-tilebtn{--p:0;position:relative;width:64px;height:64px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:conic-gradient(var(--c-ok) calc(var(--p)*1%),var(--c-line) 0);transition:transform var(--t-fast) var(--ease)}
.ev-tilebtn:active{transform:scale(.9)}
.ev-tilebtn::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--c-surface);transition:background var(--t-fast)}
.ev-tilebtn>span,.ev-tilebtn>svg{position:relative}
.ev-tilebtn svg{width:26px;height:26px;color:var(--c-line-ctl);fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:color var(--t-fast)}
.ev-tilebtn>span{font:700 17px var(--font);font-variant-numeric:tabular-nums;color:var(--c-text)}
.ev-tilebtn[aria-checked="true"]::before{background:var(--c-ok)}
.ev-tilebtn[aria-checked="true"] svg{color:var(--c-on-ok)}
.ev-tilebtn[aria-checked="true"]>span{color:var(--c-on-ok)}
.ev-tilebtn[data-pop="true"]{animation:pop .45s var(--spring)}
.ev-tilebtn:disabled{opacity:.45}
.ev-tile .n{font-size:14px;font-weight:600;line-height:1.35;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-tile .s{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--c-muted);font-weight:500}
.ev-tile .s .fl{display:inline-flex;align-items:center;gap:3px;color:var(--c-warn-text);font-weight:700}
.ev-tile .s .fl svg{width:13px;height:13px;fill:currentColor;stroke:none}
.ev-tile .s .fl[data-zero="true"]{color:var(--c-muted)}
.ev-tile .st{position:absolute;top:10px;right:10px;display:flex;gap:0}
.ev-tile .st button{width:26px;height:26px;border-radius:50%;border:0;background:var(--c-surface);box-shadow:inset 0 0 0 1.5px var(--c-line-ctl);color:var(--c-text);font:700 15px/1 var(--font);display:grid;place-items:center}
.ev-tile .st button:disabled{opacity:.4}
.ev-tile .st b{min-width:30px;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
/* จุดเริ่ม section: หัวหน้ามีจุดสี + จำนวน */
.ev-sec-head h3{display:flex;align-items:center;gap:8px}
.ev-sec-head h3 .cnt{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:var(--r-pill);background:var(--c-fill);color:var(--c-muted);font-size:12px;font-weight:700;letter-spacing:0}
.ev-po{height:36px;padding:0 14px;border-radius:var(--r-pill);border:0;background:var(--c-surface);color:var(--c-warn-text);font:600 13px var(--font);box-shadow:inset 0 0 0 1.5px var(--warn-line);display:inline-flex;align-items:center;gap:6px;transition:transform var(--t-fast) var(--ease)}
.ev-po:active{transform:scale(.94)}
.ev-po svg{width:15px;height:15px}
/* v26: จุดสีประจำประเภทในหน้ารายการ + เปลวไฟในสถิติรายละเอียด */
.ev-badge[data-t="habit"]{background:rgba(24,166,106,.13);color:var(--c-ok-text)}
.ev-badge[data-t="task"]{background:var(--c-warn-soft);color:var(--c-warn-text)}
.ev-badge[data-t="event"]{background:var(--c-fill);color:var(--c-text)}
.ev-badge[data-t="class"]{background:var(--c-accent-soft);color:var(--c-accent-text)}
.ev-stats3 b svg{width:16px;height:16px;fill:var(--c-warn);margin-right:3px;vertical-align:-1px}
/* ============ v27: ฟอร์มแยกการ์ดตามหมวด · สถิติแบบรายวัน (ไม่ใช้เปอร์เซ็นต์/แถบ) ============ */
.ev-sect{display:grid;gap:16px;padding:18px;border-radius:24px;background:var(--c-fill);min-width:0}
.ev-sect-h{display:flex;align-items:center;justify-content:space-between;gap:12px}.ev-sect-h b{display:block;font-size:15px}.ev-sect-h small{display:block;margin-top:2px;font-size:12.5px;color:var(--c-muted)}
.ev-sect:has(.ev-sect-h:only-child) .ev-sect-h{margin:0}
.ev-fld{display:grid;gap:10px;min-width:0}.ev-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev-sect .ev-seg{background:var(--c-line)}
.ev-sect .ev-qd button{background:var(--c-surface);box-shadow:inset 0 0 0 1.5px var(--c-line-ctl)}.ev-sect .ev-qd button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent);box-shadow:none}
.ev-tf{position:relative;display:grid;gap:2px;padding:10px 14px;border-radius:16px;background:var(--c-surface);box-shadow:inset 0 0 0 1.5px var(--c-line-ctl);overflow:hidden;cursor:pointer}
.ev-tf span{font-size:12px;color:var(--c-muted);font-weight:600}.ev-tf b{font-size:17px;font-variant-numeric:tabular-nums}
.ev-tf input{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:0;font-size:16px;cursor:pointer}
.ev-cust{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ev-cust .ev-seg{flex:1;min-width:150px}
.ev-in2{height:44px;padding:0 12px;border-radius:14px;border:0;background:var(--c-surface);box-shadow:inset 0 0 0 1.5px var(--c-line-ctl);font:500 15px var(--font);color:var(--c-text);min-width:0;flex:1}
.ev-num{width:72px;flex:none;text-align:center}
.ev-po-block{width:100%;justify-content:center;margin:12px 0 4px}
.ev-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 6px;margin-top:16px}
.ev-wk>div{display:grid;justify-items:center;gap:6px;font-size:12.5px;color:var(--c-muted);font-weight:600}.ev-wkh{font-size:12px!important}
.ev-dot{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--c-fill);color:var(--c-muted);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ev-dot svg{width:55%;height:55%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ev-dot[data-s="full"]{background:var(--c-ok);color:var(--c-on-ok)}.ev-dot[data-s="part"]{background:rgba(24,166,106,.28);color:var(--c-text)}
.ev-dot[data-s="off"],.ev-dot[data-s="future"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c-line);color:var(--c-line-ctl)}
.ev-wk [data-today="true"] .ev-dot{box-shadow:0 0 0 2px var(--c-surface),0 0 0 4px var(--c-accent)}
.ev-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--c-muted)}.ev-legend span{display:inline-flex;align-items:center;gap:6px}
.ev-legend i,.ev-trail i{display:block;width:10px;height:10px;border-radius:50%;background:var(--c-fill);box-shadow:inset 0 0 0 1.5px var(--c-line-ctl)}
.ev-legend [data-s="full"],.ev-trail [data-s="full"]{background:var(--c-ok);box-shadow:none}.ev-legend [data-s="part"],.ev-trail [data-s="part"]{background:rgba(24,166,106,.35);box-shadow:none}
.ev-trail{display:grid;grid-template-columns:repeat(7,12px);gap:5px;margin-top:10px}.ev-trail[data-m="true"]{grid-template-columns:repeat(14,10px);gap:4px}
.ev-trail[data-m="true"] i{width:10px;height:10px}.ev-trail i{width:12px;height:12px}

async function apiFetch(path,opt={}){
  const doCall=t=>{const h={'Content-Type':'application/json',...(opt.headers||{})};if(t)h.Authorization='Bearer '+t;
    return fetch(API+path,{...opt,headers:h})};
  let t=Tok.get();let r=await doCall(t&&t.access_token);
  if(r.status===401&&t&&t.refresh_token){
    const rr=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:t.refresh_token})});
    if(rr.ok){const fresh=await rr.json();Tok.set(fresh);r=await doCall(fresh.access_token)}
  }
  return r;
}

 async apply({upserts,removes}){const jobs=[...upserts.map(it=>apiFetch('/items/'+encodeURIComponent(it.id),{method:'PUT',body:JSON.stringify(it)})),
  ...removes.map(id=>apiFetch('/items/'+encodeURIComponent(id),{method:'DELETE'}))];
  const res=await Promise.all(jobs);const bad=res.find(r=>!r.ok);if(bad)throw new Error('save '+bad.status)}};
function diffItems(prev,next){const m=new Map(prev.map(x=>[x.id,JSON.stringify(x)])),ids=new Set(next.map(x=>x.id));return {upserts:next.filter(x=>m.get(x.id)!==JSON.stringify(x)),removes:prev.filter(x=>!ids.has(x.id)).map(x=>x.id)}}
async function syncChanges(prev,next){const ch=diffItems(prev,next);if(!ch.upserts.length&&!ch.removes.length)return;await Repo.apply(ch,{items:next})}

function occursOn(it,ds){const d0=parse(it.start),d=parse(ds),r=it.repeat;if(d<d0||(it.end&&d>parse(it.end)))return false;
 if(r.unit==='none')return ds===it.start;
 if(r.unit==='day')return Math.round((d-d0)/DAY_MS)%r.every===0;
 if(r.unit==='week')return r.days.includes(d.getDay())&&Math.floor(Math.round((d-addDays(d0,-d0.getDay()))/DAY_MS)/7)%r.every===0;
 return d.getDate()===d0.getDate()&&((d.getFullYear()-d0.getFullYear())*12+d.getMonth()-d0.getMonth())%r.every===0}
const val=(it,ds)=>it.log[ds]||0,target=it=>it.track==='count'||it.track==='timer'?it.target:1,tracked=it=>it.track!=='none';
const isDone=(it,ds)=>val(it,ds)>=target(it),skipped=(it,ds)=>!!it.skip[ds],isFuture=ds=>ds>TODAY;

/* ===== MODULE: services/notify (ตามระบบจริง: รายการใหม่เปิด "ตรงเวลา" ให้อัตโนมัติ · ต้องมีเวลา · ลงทะเบียนเครื่องกับ Worker) =====
   ลำดับของจริง: ขอสิทธิ์ → กุญแจ VAPID → pushManager.subscribe → POST /push/subscribe → จำสถานะ (เดโมจำลองขั้นสมัครด้วยการรอ) */
const PUSH_KEY='evarel-push-sub-v2';
/* ปุ่ม/การลงทะเบียนเครื่อง: ใช้ endpoint จริงของ Worker (กุญแจ VAPID -> สมัคร -> บันทึก) */
async function registerPushReal(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return 'unsupported';
  if(Notification.permission==='denied')return 'denied';
  if(Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted')return 'not-asked'}
  const t=Tok.get();if(!t)return 'auth';
  const kr=await fetch(API+'/push/key');if(!kr.ok)return 'no-key';
  const {publicKey}=await kr.json();
  const b64=publicKey.replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b64+'='.repeat((4-b64.length%4)%4));
  const u8=new Uint8Array([...raw].map(c=>c.charCodeAt(0)));
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub&&sub.options.applicationServerKey){const have=new Uint8Array(sub.options.applicationServerKey);
    const same=have.length===u8.length&&have.every((v,i)=>v===u8[i]);if(!same){await sub.unsubscribe();sub=null}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8});
  const sr=await apiFetch('/push/subscribe',{method:'POST',body:JSON.stringify(sub.toJSON())});
  if(sr.status===403)return 'limit';
  if(!sr.ok)return 'server';
  return 'ok';
}

async function authSubmit(kind,form){clearErrs(form);const v=Object.fromEntries(new FormData(form)),errs=authValidate(kind,v),keys=Object.keys(errs);
 if(keys.length){keys.forEach(k=>fieldErr(form,k,errs[k]));form.querySelector(`[name="${keys[0]}"]`)?.focus();haptic();return}
 setBusy(form,true);
 try{
  if(kind==='forgot'||kind==='signup'){const email=v.email.trim(),r=kind==='signup'?await Auth.signUp({name:v.name.trim(),email,password:v.password}):await Auth.sendReset(email);
   Object.assign(UI.auth,{email:r.email||email,codeType:kind==='signup'?'signup':'recovery',demoCode:r.demoCode||'',screen:'code'});renderAuthRoot();return}
  if(kind==='code'){const user=await Auth.verifyCode(UI.auth.email,v.code,UI.auth.codeType);if(UI.auth.codeType==='signup'){await enterApp(user);return}UI.auth.code=v.code;UI.auth.screen='newpw';renderAuthRoot();return}
  if(kind==='newpw'){await Auth.resetPassword(UI.auth.email,UI.auth.code,v.password);UI.auth.screen='login';renderAuthRoot();toast('ตั้งรหัสผ่านใหม่แล้ว เข้าสู่ระบบได้เลย');return}
  await enterApp(await Auth.signInEmail(v.email.trim(),v.password))}
 catch(err){setBusy(form,false);if(err.code==='email_taken')fieldErr(form,'email',AU_MSG.email_taken);else{const fe=form.querySelector('#form-err');fe.textContent=AU_MSG[err.code]||AU_MSG.unknown;fe.hidden=false;fe.style.animation='none';void fe.offsetWidth;fe.style.animation=''}haptic()}}
async function authGoogle(btn){const root=$('auth'),old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="ev-spin"></span>';root.innerHTML=GOOGLE_SPLASH;await new Promise(r=>setTimeout(r,900));
 try{await enterApp(await Auth.signInGoogle())}catch(err){renderAuthRoot();toast(AU_MSG[err.code]||AU_MSG.unknown);btn.disabled=false;btn.innerHTML=old}}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='f-password'&&t.closest('[data-kind="signup"]')){const p=t.value,s=[p.length>=PW_MIN,p.length>=12,/[a-z]/.test(p)&&/[A-Z]/.test(p),/\d/.test(p),/[^\w]/.test(p)].filter(Boolean).length,lv=p.length<PW_MIN?(p?1:0):Math.min(4,Math.max(1,s-1));
 $('pwMeter').dataset.lv=lv;$('pwLabel').textContent=p?(p.length<PW_MIN?`อีก ${PW_MIN-p.length} ตัวอักษรจึงจะใช้ได้`:['','อ่อน','พอใช้','ดี','แข็งแรง'][lv]):'ใช้ตัวพิมพ์เล็ก-ใหญ่ ตัวเลข และสัญลักษณ์ผสมกันจะปลอดภัยขึ้น'}
 if(t.closest('.ev-authform')&&t.getAttribute('aria-invalid')==='true'){t.setAttribute('aria-invalid','false');const b=$('e-'+t.name);if(b){b.hidden=true;b.innerHTML=''}}});
/* v25: ตรวจรูปแบบอีเมลสดทุกการแก้ไข (พิมพ์/ลบ/วาง/autofill — ตรงกับระบบจริง 2026.7.0/8.1) */
document.addEventListener('input',e=>{const t=e.target;if(t.name!=='email'||!t.closest?.('.ev-authform'))return;const b=$('e-email');if(!b)return;const v=t.value.trim();
 if(!v||EMAIL_RE.test(v)){b.hidden=true;b.dataset.tone='';b.innerHTML=''}else{b.hidden=false;b.dataset.tone='hint';b.innerHTML='<span>รูปแบบอีเมลไม่ถูกต้อง (เช่น name@gmail.com)</span>'}});

 while(LAYERS.length)popLayer();closePop();destroyCal('main');destroyCal('habit');DETAIL=null;S.items=[];CH={list:[],cur:null};TM=null;USER=null;

let swipeX=null;

const errorView=()=>`<div class="ev-error">${empty('x','โหลดข้อมูลไม่สำเร็จ','ตรวจสอบการเชื่อมต่อแล้วลองใหม่')}<button class="ev-btn-primary" data-act="retry">ลองใหม่</button></div>`;

/* ===== MODULE: render ===== */
const COUNTED=new WeakSet();
function animateCounts(root){root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;let from=parseFloat(el.textContent);if(!COUNTED.has(el)){COUNTED.add(el);from=0}if(Number.isNaN(from))from=0;
 cancelAnimationFrame(el._raf);if(from===to){el.textContent=to;return}const t0=performance.now(),dur=700,f=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)el._raf=requestAnimationFrame(f)};el._raf=requestAnimationFrame(f)})}
function setBar(el,v){const k=el.dataset.kind;if(k==='arc')el.style.strokeDashoffset=ARC_C*(1-v/100);else if(k==='col')el.style.transform=`scaleY(${v/100})`;else if(el.closest('.ev-prog'))el.style.setProperty('--w',v);else el.style.width=v+'%'}
function growBars(root){root.querySelectorAll('[data-to]').forEach(el=>{const to=Math.max(0,Math.min(100,+el.dataset.to||0));
 if(GROWN.has(el)){setBar(el,to);return}GROWN.add(el);setBar(el,0);requestAnimationFrame(()=>requestAnimationFrame(()=>setBar(el,to)))})}
const navHTML=()=>{const tabs=TABS.map(([id,l,ic])=>`<li data-key="t-${id}"><button data-tab="${id}" ${UI.tab===id?'aria-current="page"':''}><span class="pill">${icon(ic)}</span>${l}</button></li>`);tabs.splice(2,0,`<li data-key="t-add"><button class="add" data-act="add" aria-label="เพิ่มรายการ">${icon('plus')}</button></li>`);return tabs.join('')};
/* เข้าหน้าใหม่ = เล่นอนิเมชั่นเข้า · อัปเดตในหน้าเดิม = patch เฉพาะที่เปลี่ยน (ไม่กระตุก ไม่เล่นซ้ำ) */
function render(){document.body.dataset.auth=UI.auth.status==='in'?'in':'out';if(UI.auth.status!=='in'){renderAuthRoot();return}$('auth').hidden=true;$('auth').dataset.screen='';
 const root=$('app'),enter=UI.animate&&!UI.loading,view=UI.loading?'load':UI.error?'err':UI.tab,html=UI.loading?skeleton():UI.error?errorView():VIEWS[UI.tab]();
 if(enter||UI.loading||root.dataset.view!==view||!root.firstElementChild){root.innerHTML=html;root.dataset.view=view;root.classList.toggle('ev-enter',enter);[...root.children].forEach((c,i)=>c.style.setProperty('--i',i))}
 else{root.classList.remove('ev-enter');patch(root,html)}
 growBars(root);animateCounts(root);patch($('nav'),navHTML());UI.animate=false;UI.weekDir=0;
 if(UI.tab==='calendar'&&!UI.loading&&!UI.error)syncMainCal();else destroyCal('main');
 updateLive();refreshDetail()}
async function loadApp(){UI.auth.status='in';CH=loadChats();TM=loadTM();UI.loading=true;UI.error=null;render();
 try{const [s]=await Promise.all([Repo.load(),wait(SKELETON_MS)]);S.items=s.items}catch(err){console.warn('load failed',err);UI.error=err}
 UI.loading=false;UI.animate=true;render()}
async function boot(){syncThemeColor();UI.auth.status='loading';render();try{USER=(Auth.takeOAuthReturn?await Auth.takeOAuthReturn().catch(()=>null):null)||await Auth.session()}catch(err){console.warn('session failed',err);USER=null}
 if(!USER){UI.auth.status='out';UI.auth.screen='welcome';render();return}await loadApp()}
boot();

/* v23: ประตูกันอนิเมชั่นซ้ำ — หลังเล่นเข้าเสร็จ หน้าหลัก/หน้ารายละเอียดจะไม่เล่นอนิเมชั่นเข้าอีก */
let settleT=0;const _render=render;render=function(){const H=document.documentElement,en=UI.animate;if(en){H.removeAttribute('data-settled');clearTimeout(settleT);settleT=0}const r=_render.apply(this,arguments);if(!H.dataset.settled&&!settleT)settleT=setTimeout(()=>{H.dataset.settled='1';settleT=0},1300);return r};
